name: CI

# The gate, and only the gate, decides whether a commit is green.
#
#   gate             hermetic, blocking. Mirrors `make gate` exactly — same
#                    targets, so there is no drift between a runner and a laptop.
#   e2e              Playwright against a PRODUCTION build. Non-blocking today
#                    (see the job's header for what has to be true before the
#                    flip). It runs so the suite cannot rot unwitnessed.
#   precommit        the hook set (whitespace, yaml, the local ruff/mypy shims).
#
# The integration-tagged contracts run in their own NON-GATING workflow —
# .github/workflows/integration.yml (nightly + on demand, with live Postgres +
# ClickHouse services). They used to ride this workflow on every main push; they
# were dark coverage before that (the marker is excluded from the gate everywhere).
#
# No secrets are referenced anywhere in this workflow. A fork PR must be able to
# run the gate.

on:
  push:
    # `main` is the trunk; the agent branches are the only other things pushed
    # here, and they merge into `main` without a PR (no branch protection yet),
    # so they need the gate *before* the merge, not after it.
    branches: ["main", "claude/**", "codex/**", "antigravity/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a branch push is thrift; superseding a `main` push is a hole. Since
  # 2026-07-10 CI *is* the second pass of the gate — the local run is no longer
  # doubled — and stop-the-line reads main's CI to decide whether work may continue.
  # With `cancel-in-progress` unconditional, a burst of merges cancelled every run but
  # the last, and the commits in between were never verified by anything. Observed, not
  # supposed: runs 29100291971 (`46dacd36`) and 29101191063 (`db4893f8`, the one meant
  # to prove the e2e seed) were both cancelled by the next merge, minutes apart.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.5.4"
  NODE_VERSION: "20"

jobs:
  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false
      - name: Format contract
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialise providers without the remote backend
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: infra/terraform
        run: terraform validate

  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # The pnpm pin (`packageManager: pnpm@9.15.0`) lives in
      # webapp/frontend/package.json. Corepack only honours it when pnpm is
      # invoked from a directory under that package — from the repo root it
      # finds no pin and silently fetches the newest pnpm, which is how this job
      # first failed: pnpm 11.11.0 on Node 20 (`No such built-in module:
      # node:sqlite`). So: never invoke pnpm at the root. That rules out
      # setup-node's `cache: pnpm`, whose store probe runs there; the store is
      # cached explicitly instead, resolved from the directory that holds the pin.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: webapp/frontend
        run: |
          corepack pnpm --version
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webapp/frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # FRONTEND FIRST, and the order is load-bearing — the same order `make gate-checks`
      # uses, for the same reason. The python suite contains a test that judges the frontend
      # (tests/unit/test_zod_codegen.py formats through `biome`), and only the pnpm STORE is
      # cached above — never `node_modules/`. So on a cold runner `make gate-py` would run
      # before anything had installed biome, and would go red claiming "the checked-in zod is
      # stale": an environment problem wearing a code regression's clothes. It never fired
      # only because CI is billing-blocked; it was armed the whole time.
      - name: Frontend — install, tsc, biome, vitest
        run: make gate-web

      - name: Python — ruff, mypy, pytest (not integration)
        run: make gate-py

  # The gate builds no image, so a Dockerfile / .dockerignore regression is invisible
  # to it — twice proven at cutover (a dropped `COPY eval`; then `.dockerignore` stripping
  # eval/reports), each surfacing only when the container booted, not when the gate ran.
  # This job closes that blind spot: it builds the agent image and runs the image-only
  # preflight (eval package imports · seed reports load · app factory builds) with no
  # external services, via `make image-preflight` so there is no drift from the laptop.
  image-preflight:
    name: image-preflight (agent image builds & self-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the agent image and run its image-only preflight
        run: make image-preflight

  e2e:
    name: e2e (Playwright, production build)
    runs-on: ubuntu-latest
    needs: [gate, terraform]
    # ─────────────────────────────────────────────────────────────────────────
    # NON-BLOCKING for one more window, and the reason is now a measurement not
    # yet taken rather than a problem that cannot be solved.
    #
    # The suite itself is repaired: 182 passed / 0 failed / 0 skipped, twice in
    # a row, against a seeded local stack. On a bare runner it was 160/19/2 (run
    # 29086077194), and the 19 were never spec debt — they were an empty
    # database. `sources.spec.ts` expects 17 catalogue rows (15 corpus
    # categories + long-term memory + transcript) and found 2.
    #
    # The premise "seeding needs embeddings, which needs a model, which needs a
    # secret" had a third path, and this job now takes it: the corpus is
    # embedded ONCE on the on-prem stack and committed as a fixture (`make
    # seed-fixture`); CI restores it with `psql`. Deterministic, hermetic, zero
    # secret, no model on the runner. `tests/unit/test_seed_fixture.py` is the
    # staleness guard, so the fixture cannot quietly fall behind the corpus.
    #
    # THE FLIP (delete `continue-on-error` below) is owed the moment this job
    # runs green on a runner twice in a row — and not one commit earlier. A gate
    # promoted on the strength of the seed *landing*, rather than on two green
    # runs, would be the same "weaker gate wearing the gate's name" this comment
    # refused last window. The runs are the criterion. Nothing else is.
    # ─────────────────────────────────────────────────────────────────────────
    continue-on-error: true
    # A suite that fails wholesale must not also run away with the runner: every
    # red spec costs its timeout, and `retries: 1` in CI pays it twice.
    timeout-minutes: 45
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TESSERA_POSTGRES__DSN: postgresql://tessera:tessera@localhost:5432/tessera
      TESSERA_BACKEND_URL: http://localhost:8290
      E2E_BASE_URL: http://localhost:3390
      # The cockpit's default read medium. `local` (JSONL spine) keeps this job
      # free of a ClickHouse service; the `spine` medium is exercised by the
      # backend's own integration tests, not here.
      TESSERA_SPINE_SOURCE: local
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable

      # See the `gate` job: pnpm is never invoked from the repo root, where the
      # `packageManager` pin is invisible.
      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: webapp/frontend
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('webapp/frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # limes resolves from git+https://github.com/AmadouMamane/Limes.git at a
      # pinned sha (ADR 0029): public repo, no auth token needed; the hosted
      # runners ship git, so `uv sync` needs nothing extra here.
      - name: Sync Python deps
        run: uv sync

      - name: Install frontend deps
        working-directory: webapp/frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: webapp/frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      # The corpus, embedded once on the on-prem stack and committed. No model,
      # no key, no network: `psql` replays 241 chunks and their HNSW index into
      # this runner's Postgres. `ON_ERROR_STOP` because a half-restored corpus
      # would surface as a dozen mislabelled content assertions, never as "the
      # seed failed" — the same class of lie the missing AUTH_SECRET told.
      #
      # `set -o pipefail` — GitHub runs `run:` blocks under `bash -e {0}`: `-e` is on,
      # PIPEFAIL IS NOT. Without it a pipeline reports its LAST command, so `gunzip |
      # psql` reported psql's success while gunzip choked on a truncated fixture (psql
      # cheerfully applies the valid prefix — ON_ERROR_STOP stops SQL *errors*, not a
      # short read), and `psql | tee` reported that TEE HAD WRITTEN A FILE. A dead
      # database was a green seed step. This is ADR 0026's origin instance, in CI.
      - name: Seed Postgres from the committed fixture
        run: |
          set -o pipefail
          gunzip -c fixtures/e2e/pgvector-seed.sql.gz \
            | psql "$TESSERA_POSTGRES__DSN" -v ON_ERROR_STOP=1 -q
          psql "$TESSERA_POSTGRES__DSN" -tAc \
            'select count(*) from tessera_local.documents' | tee /tmp/seed-rows
          test "$(cat /tmp/seed-rows)" -gt 200

      - name: Start backend (:8290)
        run: |
          TESSERA_API__PORT=8290 uv run python scripts/run_local.py > /tmp/tessera-backend.log 2>&1 &
          curl -sf --retry 60 --retry-connrefused --retry-delay 1 --max-time 120 \
            http://localhost:8290/healthz

      # A production build, never `next dev`. Measured on this tree (three runs,
      # same commit): `next dev` at 4 workers reported 102 failures, all of them
      # timeouts from on-demand route compilation starving the backend's
      # 10-connection pool. `next start` at 1 worker reported the real 31. The
      # worker count lives in playwright.config.ts, with the measurement in its
      # header; it is not something to raise for speed.
      - name: Build frontend (production)
        working-directory: webapp/frontend
        run: corepack pnpm build

      # NextAuth refuses to mint a session without a secret, and it fails *soft*:
      # every authenticated page still returns 200, rendered as its logged-out
      # shell. The specs then log in, land on a page with no table, and report
      # ~170 content failures that name the missing table, never the missing
      # secret. Measured on 2026-07-10, in a worktree with no `.env.local`.
      #
      # This is not a repository secret. It is 32 random bytes minted for this
      # run, alive only inside this ephemeral runner, and it grants nothing
      # anywhere else. The gate remains secret-free.
      - name: Mint an ephemeral session secret
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start frontend (:3390)
        working-directory: webapp/frontend
        run: |
          corepack pnpm start -p 3390 > /tmp/tessera-front.log 2>&1 &
          curl -sf --retry 90 --retry-connrefused --retry-delay 1 --max-time 240 \
            http://localhost:3390/api/healthz
          # `/api/healthz` says nothing about RSC rendering. An authenticated
          # page does. A 200 or a 307-to-login both prove the render path works;
          # a 500 is the corrupted-build symptom that once looked like 185 red
          # specs.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3390/fr/agents)
          echo "GET /fr/agents → $code"
          test "$code" != "500"
          # That request exercised the auth path. If the secret were missing it
          # would have logged it here and still answered 200 — fail loudly now
          # rather than as 170 mislabelled content assertions half an hour later.
          ! grep -q "MissingSecret" /tmp/tessera-front.log

      - name: Playwright
        working-directory: webapp/frontend
        run: corepack pnpm test:e2e

      - name: Backend log (on failure)
        if: failure()
        run: tail -n 200 /tmp/tessera-backend.log /tmp/tessera-front.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: webapp/frontend/playwright-report/
          retention-days: 7

  precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync  # local ruff/mypy hooks shell out to `uv run`
        run: uv sync
      - uses: pre-commit/action@v3.0.1
