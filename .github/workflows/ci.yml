name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.4"

jobs:
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync (dev only)
        run: uv sync --only-dev

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync
        run: uv sync

      - name: mypy
        run: uv run mypy src/tessera

  test-unit:
    name: pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync
        run: uv sync

      - name: pytest (unit)
        run: uv run pytest tests/unit/ --cov=src/tessera --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 7

  test-integration:
    name: pytest (integration)
    runs-on: ubuntu-latest
    needs: [typecheck, test-unit]
    # Non-blocking: a subset of integration tests needs a seeded Postgres and a
    # live LLM (Ollama/Vertex) that the hosted runner does not provide. They run
    # for visibility but do not gate the workflow; run them locally with services.
    continue-on-error: true
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      contains(github.event.pull_request.labels.*.name, 'integration')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TESSERA_POSTGRES__DSN: postgresql://tessera:tessera@localhost:5432/tessera_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: pytest (integration)
        run: uv run pytest tests/integration/ -m integration -ra

  precommit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync  # local ruff/mypy hooks shell out to `uv run`
        run: uv sync
      - uses: pre-commit/action@v3.0.1
