name: Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write   # required for keyless auth to GCP via OIDC

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  REGION: europe-west1
  REPOSITORY: tessera

jobs:
  build-and-deploy:
    name: Build + deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v7

      - id: gcp-auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Resolve image tag
        id: image
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git rev-parse --short HEAD)"
          fi
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/tessera-agent:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"     >> "$GITHUB_OUTPUT"

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/tessera-agent:latest
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=tessera/${{ github.event.inputs.environment || 'production' }}"

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "image=${{ steps.image.outputs.image }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe tessera-agent --region=${{ env.REGION }} --format='value(status.url)')"
          for _ in 1 2 3 4 5; do
            if curl -fsS "${URL}/healthz" >/dev/null; then
              echo "healthz OK at ${URL}"; exit 0
            fi
            sleep 5
          done
          echo "::error::healthz did not return 200 after 25s"; exit 1
