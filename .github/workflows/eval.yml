name: Eval

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      case:
        description: "Run only the case with this id (e.g. 03_hallucination_fact). Empty = run all."
        required: false
        default: ""
      language:
        description: "Restrict to one language (fr, de, en). Empty = all."
        required: false
        default: ""
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.5.4"

jobs:
  run-eval:
    name: Non-regression failure catalogue
    runs-on: ubuntu-latest
    # PR-label gate: only run on labelled PRs to avoid burning quota on every push.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'eval')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TESSERA_POSTGRES__DSN: postgresql://tessera:tessera@localhost:5432/tessera
      TESSERA_LLM_PROFILE: on_prem
      TESSERA_OBSERVABILITY__METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync with eval group
        run: uv sync --group eval

      - name: Run the failure catalogue
        id: eval
        run: |
          set -o pipefail
          ARGS=""
          if [[ -n "${{ inputs.case }}" ]]; then ARGS="$ARGS --case ${{ inputs.case }}"; fi
          if [[ -n "${{ inputs.language }}" ]]; then ARGS="$ARGS --lang ${{ inputs.language }}"; fi
          uv run python scripts/run_eval.py $ARGS | tee eval/reports/scorecard.md

      # The eval-gate, per agent: each agent runs its bound set (curated subset +
      # the shared security floor) under the two-level gate (critical zero-tolerance
      # AND domain >= min_pass_rate). The job fails if ANY agent's gate fails — this
      # is the CI manifestation of "an agent that fails its set is blocked".
      - name: Per-agent eval-gates
        if: ${{ inputs.case == '' }}
        run: |
          set -o pipefail
          AGENTS=$(uv run python -c "from tessera.agent.registry import list_agents; print(' '.join(a.id for a in list_agents()))")
          LANG_ARG=""
          if [[ -n "${{ inputs.language }}" ]]; then LANG_ARG="--lang ${{ inputs.language }}"; fi
          rc=0
          for a in $AGENTS; do
            echo "::group::eval-gate $a"
            uv run python scripts/run_eval.py --agent "$a" $LANG_ARG || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-scorecard-${{ github.run_id }}
          path: |
            eval/reports/latest.json
            eval/reports/scorecard.md
          retention-days: 30

      - name: Comment scorecard on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: tessera-eval
          path: eval/reports/scorecard.md
