name: Eval

# The harness has two halves, and only one of them can run on a GitHub-hosted runner.
#
#   * The DETERMINISTIC half — guard, router, policy short-circuits and the pass
#     criteria — needs no model, no database and no secrets. Measured 2026-07-12,
#     it closes 122 of the catalogue's 174 (case, language) runs on its own, in
#     ~5 seconds. That half is gated here, on every push, by exact match against a
#     committed baseline (`eval/baselines/null-control.json`).
#
#   * The MODEL half needs an LLM. `ubuntu-latest` has no Ollama and no Vertex
#     credentials, so a replay launched there is a *modelless* run — and the runner
#     does not crash without a backend: it completes every case, still writes
#     `model: "llama3.2:3b"` into the report, and scores the deterministic layer
#     alone. Running the replay on a hosted runner would therefore not produce a
#     weak model verdict, it would produce a FAKE one. It is operator-triggered on
#     a machine that actually has a model, and `check_ratchet` refuses any report
#     that generated zero output tokens.
#
# This split is the point: CI gates what it can honestly gate, and refuses to
# pretend about the rest.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:00 UTC — the deterministic control only.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to replay the catalogue against (e.g. llama3.3:70b). Requires a model-capable runner."
        required: false
        default: ""
      runner:
        description: "Runner label for the model replay (must have Ollama or Vertex credentials)."
        required: false
        default: "self-hosted"
      language:
        description: "Restrict the replay to one language (fr, de, en). Empty = all."
        required: false
        default: ""
      min_contribution:
        description: "Rule 2's bar — how many of the 52 floor-failing runs the model must close. Calibrated on a sweep, never invented."
        required: false
        default: "30"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.5.4"

jobs:
  # ── The gate CI can actually hold ─────────────────────────────────────────
  null-control:
    name: Deterministic control (no model, no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # `make eval-null` points every LLM backend at a closed port, so nothing can
      # quietly answer, then ratchets the result. A control run in which a model
      # DID speak is rejected as loudly as one that regressed.
      - name: Replay the catalogue with no model, and ratchet it
        run: make eval-null

      - name: Upload the control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-null-control-${{ github.run_id }}
          path: .eval-control/null-control.json
          retention-days: 30

  # ── The half that needs a model: operator-triggered, never faked ──────────
  model-replay:
    name: Model replay (${{ inputs.model || 'default' }})
    # Dispatch only. A schedule pointed at a hosted runner would file a modelless
    # run as a nightly "result" — the exact failure this workflow exists to
    # prevent. The ratchet's liveness check is the backstop; this `if` is the fence.
    if: github.event_name == 'workflow_dispatch' && inputs.model != ''
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync with the eval group
        run: uv sync --group eval

      - name: Replay the catalogue
        run: |
          set -o pipefail
          ARGS="--model ${{ inputs.model }}"
          if [[ -n "${{ inputs.language }}" ]]; then ARGS="$ARGS --lang ${{ inputs.language }}"; fi
          uv run python scripts/run_eval.py $ARGS --report eval/reports/replay.json \
            | tee eval/reports/scorecard.md

      # A report with zero generated tokens never reached a model, whatever its
      # `model` field claims. Fail rather than file it.
      - name: Assert a model actually answered
        run: uv run python scripts/assert_model_spoke.py eval/reports/replay.json

      # The contribution gate (ruling 2026-07-12). The absolute rate is NOT the grade:
      # llama3.2:3b and gemma3:27b both score 157/174, yet one of them breaks a case the
      # agent passes with no model at all. Rule 1 — zero regressions on the 122 runs the
      # null floor passes (each candidate replayed, because sampling is stochastic).
      # Rule 2 — close at least `min_contribution` of the 52 runs the floor fails.
      - name: Contribution gate (delta over the null floor)
        run: |
          uv run python scripts/check_contribution.py \
            --report eval/reports/replay.json \
            --min-contribution ${{ inputs.min_contribution }}

      # The per-agent eval-gate: each agent is replayed against its bound set
      # (curated subset + the shared security floor) under the two-level gate
      # (critical zero-tolerance AND domain >= min_pass_rate). Any agent failing
      # its gate fails the job.
      - name: Per-agent eval-gates
        run: |
          set -o pipefail
          AGENTS=$(uv run python -c "from tessera.agent.registry import list_agents; print(' '.join(a.id for a in list_agents()))")
          LANG_ARG=""
          if [[ -n "${{ inputs.language }}" ]]; then LANG_ARG="--lang ${{ inputs.language }}"; fi
          rc=0
          for a in $AGENTS; do
            echo "::group::eval-gate $a"
            uv run python scripts/run_eval.py --agent "$a" --model "${{ inputs.model }}" $LANG_ARG || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard-${{ github.run_id }}
          path: |
            eval/reports/replay.json
            eval/reports/scorecard.md
          retention-days: 30
