name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# No `security-events: write`: nothing here uploads SARIF any more. See the note
# on the removed CodeQL job below — least privilege follows the capability.
permissions:
  contents: read
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.4"

# ── A removed job, and the hole it leaves, stated ──────────────────────────────
#
# `codeql` ran here until 2026-08-04 and could never have passed: GitHub code
# scanning is an Advanced Security feature, billed on a private repository, and
# it is not enabled for this one. Every run ended on
#   "Code scanning is not enabled for this repository"
# — and so did the SARIF upload that `trivy` used to attempt. A job that cannot
# succeed is worse than an absent one: it makes the workflow permanently red, and
# a permanently red workflow stops being read.
#
# What is LOST, said plainly rather than papered over: CodeQL's interprocedural
# taint analysis. Nothing free replaces it. What still covers part of the ground:
#   - ruff's `S` family (flake8-bandit) on every file, in the gate, blocking;
#   - `bandit` below, on src/, medium severity and above;
#   - `gitleaks` and `detect-secrets` for credential material;
#   - `trivy` below, for the image's OS and library packages.
# All syntactic. None of them follows a value from an HTTP parameter to a sink,
# which is precisely what CodeQL was here for. That is a DECLARED blind spot, and
# re-enabling it is an operator decision with a price attached (ADR 0026).

jobs:
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync (full)
        run: uv sync

      - name: pip-audit
        run: |
          uv pip install pip-audit
          # --skip-editable drops the local unpublished `tessera` package; not
          # --strict, since that would turn the intentional skip into an error.
          #
          # NO --ignore-vuln, since 2026-08-04. Both former exemptions were retired
          # by fact rather than by decision:
          #  - PYSEC-2025-145 (ollama) was WITHDRAWN upstream on 2026-06-10 — it
          #    described the Ollama *server*, never the python client;
          #  - PYSEC-2026-161 (starlette) is fixed in 1.0.1 and starlette now pins
          #    >=1.3.1. The `httpx2` that blocked that move is a TEST-only
          #    dependency in the dev group, kept out of the image by --no-dev.
          # An empty ignore list is the state worth defending: the next advisory
          # turns this job red instead of quietly joining a list.
          uv run pip-audit --skip-editable --progress-spinner=off

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install bandit==1.7.10

      - name: Bandit (src only)
        run: bandit -q -r src/tessera -ll -ii -c pyproject.toml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: trivy (container)
    runs-on: ubuntu-latest
    # Skip on PRs from forks — they cannot push to ghcr or read secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f infra/docker/Dockerfile.agent -t tessera-agent:scan .

      # `table`, not `sarif`. The SARIF went to code scanning, which is not enabled
      # here, so the upload failed and the findings were readable NOWHERE: the job
      # exited 1 with a log that named a count and not one package. A finding you
      # cannot read is not a finding. The table prints into the log, where the
      # person the red is for will actually see it.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tessera-agent:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          # ONE ignored finding, justified at length in the file itself: limes'
          # own eval corpus, shipped in the wheel, whose PEM body decodes to
          # "EXAMPLE ONLY - not a key". The secret scanner stays ON — it found
          # that on the very first run it was ever given.
          trivyignores: .trivyignore.yaml

  guard-policy-lint:
    name: guard policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Validate policy can be loaded
        run: |
          uv run python -c "from tessera.guard.decisions import load_policy; p = load_policy(); assert p.version >= 1, 'guard policy version must be >= 1'; print(f'policy version {p.version}, {len(p.tools)} tools')"
