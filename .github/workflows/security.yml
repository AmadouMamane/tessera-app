name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.4"

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync (full)
        run: uv sync

      - name: pip-audit
        run: |
          uv pip install pip-audit
          # --skip-editable drops the local unpublished `tessera` package; not
          # --strict, since that would turn the intentional skip into an error.
          #
          # NO --ignore-vuln, since 2026-08-04. Both former exemptions were retired
          # by fact rather than by decision:
          #  - PYSEC-2025-145 (ollama) was WITHDRAWN upstream on 2026-06-10 — it
          #    described the Ollama *server*, never the python client;
          #  - PYSEC-2026-161 (starlette) is fixed in 1.0.1 and starlette now pins
          #    >=1.3.1. The `httpx2` that blocked that move is a TEST-only
          #    dependency in the dev group, kept out of the image by --no-dev.
          # An empty ignore list is the state worth defending: the next advisory
          # turns this job red instead of quietly joining a list.
          uv run pip-audit --skip-editable --progress-spinner=off

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install bandit==1.7.10

      - name: Bandit (src only)
        run: bandit -q -r src/tessera -ll -ii -c pyproject.toml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: trivy (container)
    runs-on: ubuntu-latest
    # Skip on PRs from forks — they cannot push to ghcr or read secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -f infra/docker/Dockerfile.agent -t tessera-agent:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tessera-agent:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  guard-policy-lint:
    name: guard policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Validate policy can be loaded
        run: |
          uv run python -c "from tessera.guard.decisions import load_policy; p = load_policy(); assert p.version >= 1, 'guard policy version must be >= 1'; print(f'policy version {p.version}, {len(p.tools)} tools')"
