name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.4"

jobs:
  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: python
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:python"

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync (full)
        run: uv sync

      - name: pip-audit
        run: |
          uv pip install pip-audit
          # --skip-editable drops the local unpublished `tessera` package; not
          # --strict, since that would turn the intentional skip into an error.
          # Two advisories are ignored with justification:
          #  - PYSEC-2025-145 (ollama 0.4.9): no fixed release exists upstream.
          #  - PYSEC-2026-161 (starlette): only fixed in 1.x, whose TestClient
          #    pulls an unvetted `httpx2` dependency; starlette is pinned <1.0.
          uv run pip-audit --skip-editable \
            --ignore-vuln PYSEC-2025-145 \
            --ignore-vuln PYSEC-2026-161 \
            --progress-spinner=off

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install bandit==1.7.10

      - name: Bandit (src only)
        run: bandit -q -r src/tessera -ll -ii -c pyproject.toml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-image:
    name: trivy (container)
    runs-on: ubuntu-latest
    # Skip on PRs from forks — they cannot push to ghcr or read secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Build agent image
        run: docker build -f infra/docker/Dockerfile.agent -t tessera-agent:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tessera-agent:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif

  guard-policy-lint:
    name: guard policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Validate policy can be loaded
        run: |
          uv run python -c "from tessera.guard.decisions import load_policy; p = load_policy(); assert p.version >= 1, 'guard policy version must be >= 1'; print(f'policy version {p.version}, {len(p.tools)} tools')"
