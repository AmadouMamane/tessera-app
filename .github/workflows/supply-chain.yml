name: Supply chain

# SBOM, image signing (cosign keyless) and SLSA provenance for the agent image
# (ADR 0020). These run only in GitHub Actions and cannot be validated on a dev
# laptop — they are reviewed, then exercised here.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # A CHECK THAT CANNOT FAIL IS NOT A CHECK.
      #
      # This step used to end in `detect-secrets scan > /dev/null` whenever `.secrets.baseline`
      # was absent — which is always, because it has never been committed. `detect-secrets scan`
      # PRINTS its findings and EXITS 0 regardless of what it finds; with stdout sent to
      # /dev/null the job was green, permanently, having checked nothing and said nothing.
      #
      # This exact failure is quoted in the Makefile as a lesson already learned ("F-14:
      # detect-secrets with no baseline was a permanently-green job that checked nothing"). The
      # lesson was written down and the job was never fixed. It only never fired because CI is
      # billing-blocked; it was armed the whole time.
      #
      # `detect-secrets-hook` is the gating command — `scan` is the *authoring* one, and
      # `scan --baseline` REWRITES the baseline in place and exits 0, so it could not gate
      # either. And a missing baseline is now a BLIND SPOT, said out loud and exiting non-zero:
      # a witness that cannot see may never report "ok" (ADR 0026).
      - name: Scan against baseline
        run: |
          set -o pipefail
          if [ ! -f .secrets.baseline ]; then
            echo "::error title=detect-secrets has no baseline::.secrets.baseline is not committed, so this job cannot tell a new secret from a known one. That is a BLIND SPOT, and a blind spot is not a pass. Create it once and commit it:  detect-secrets scan > .secrets.baseline"
            exit 1
          fi
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  sign-and-provenance:
    name: cosign sign + SLSA provenance
    # Image signing needs to push to GHCR and use OIDC — skip on fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless + SLSA
    outputs:
      image: ${{ steps.img.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name  # GHCR repository names must be lowercase
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/tessera-agent" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: true
          tags: ${{ steps.img.outputs.image }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attach CycloneDX SBOM attestation
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image.sbom.cyclonedx.json

      - name: Attest SBOM with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate image.sbom.cyclonedx.json \
            --type cyclonedx "${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}"

  # SLSA build provenance for the pushed image digest.
  provenance:
    needs: sign-and-provenance
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.sign-and-provenance.outputs.image }}
      digest: ${{ needs.sign-and-provenance.outputs.digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
