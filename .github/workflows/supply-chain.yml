name: Supply chain

# SBOM, secret scanning and image signing (cosign keyless) for the agent image
# (ADR 0020). These run only in GitHub Actions and cannot be validated on a dev
# laptop — they are reviewed, then exercised here. SLSA provenance USED to live
# here and was removed on 2026-08-04; the reason, and how to restore it, is at
# the bottom of this file.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # A CHECK THAT CANNOT FAIL IS NOT A CHECK.
      #
      # This step used to end in `detect-secrets scan > /dev/null` whenever `.secrets.baseline`
      # was absent — which is always, because it has never been committed. `detect-secrets scan`
      # PRINTS its findings and EXITS 0 regardless of what it finds; with stdout sent to
      # /dev/null the job was green, permanently, having checked nothing and said nothing.
      #
      # This exact failure is quoted in the Makefile as a lesson already learned ("F-14:
      # detect-secrets with no baseline was a permanently-green job that checked nothing"). The
      # lesson was written down and the job was never fixed. It only never fired because CI is
      # billing-blocked; it was armed the whole time.
      #
      # `detect-secrets-hook` is the gating command — `scan` is the *authoring* one, and
      # `scan --baseline` REWRITES the baseline in place and exits 0, so it could not gate
      # either. And a missing baseline is now a BLIND SPOT, said out loud and exiting non-zero:
      # a witness that cannot see may never report "ok" (ADR 0026).
      # SYMLINKS ARE EXCLUDED, and the exclusion is checked rather than trusted.
      # `detect-secrets scan` refuses to follow a symlink even when handed one
      # explicitly, so a symlink can never appear in the baseline — while the hook,
      # given the same path, follows it happily. The result was a job that could not
      # be made green by any honest baseline: three symlinked message catalogues
      # under src/tessera/observability/data/messages/ were reported for ever.
      # Skipping them loses nothing ONLY IF each one's target is itself tracked and
      # therefore scanned on its own path, so that is asserted below, per link. A
      # symlink pointing outside the tracked set is a real gap and fails the job.
      - name: Scan against baseline
        run: |
          set -o pipefail
          if [ ! -f .secrets.baseline ]; then
            echo "::error title=detect-secrets has no baseline::.secrets.baseline is not committed, so this job cannot tell a new secret from a known one. That is a BLIND SPOT, and a blind spot is not a pass. Create it once and commit it:  git ls-files -z | xargs -0 detect-secrets scan --baseline .secrets.baseline"
            exit 1
          fi

          : > /tmp/ds-files
          missing=0
          while IFS= read -r f; do
            if [ -L "$f" ]; then
              target=$(cd "$(dirname "$f")" && python3 -c "import os,sys;print(os.path.relpath(os.path.realpath(os.readlink(sys.argv[1])), sys.argv[2]))" "$(basename "$f")" "$(git rev-parse --show-toplevel)" 2>/dev/null || true)
              if [ -z "$target" ] || ! git ls-files --error-unmatch "$target" >/dev/null 2>&1; then
                echo "::error title=symlink outside the scanned set::$f -> ${target:-<unresolvable>} is not tracked, so skipping the link would skip its content entirely."
                missing=1
              fi
            else
              printf '%s\n' "$f" >> /tmp/ds-files
            fi
          done < <(git ls-files)
          [ "$missing" -eq 0 ] || exit 1

          tr '\n' '\0' < /tmp/ds-files | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  sign-and-provenance:
    name: cosign sign + SBOM attestation
    # Image signing needs to push to GHCR and use OIDC — skip on fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC for cosign keyless signing
    outputs:
      image: ${{ steps.img.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image name  # GHCR repository names must be lowercase
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/tessera-agent" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: true
          tags: ${{ steps.img.outputs.image }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attach CycloneDX SBOM attestation
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image.sbom.cyclonedx.json

      - name: Attest SBOM with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate image.sbom.cyclonedx.json \
            --type cyclonedx "${{ steps.img.outputs.image }}@${{ steps.build.outputs.digest }}"

  # ── SLSA build provenance: removed 2026-08-04, and the reason is a DECISION ───
  #
  # `slsa-framework/slsa-github-generator` refused to run, on purpose:
  #
  #   "Repository is private. The workflow has halted in order to keep the
  #    repository name from being exposed in the public transparency log.
  #    Set 'private-repository' to override."
  #
  # SLSA provenance is recorded in Sigstore's PUBLIC, append-only Rekor log. The
  # override is one boolean, and it publishes this repository's name — the failing
  # run's own log had already printed every commit message it was attesting. That
  # is an outward-facing disclosure about a private repository, so it is the
  # operator's call, not a workflow tidy-up. The job ran on every push and could
  # never succeed; a permanently red workflow stops being read, so it is gone
  # rather than pinned red or, worse, silenced with continue-on-error.
  #
  # What REMAINS on every image, and it is not nothing: `cosign sign` (keyless,
  # OIDC) and a CycloneDX SBOM attached with `cosign attest`, both above, both
  # green. What is LOST is the SLSA level-3 build provenance — the non-forgeable
  # statement about WHICH workflow, at which commit, produced this digest. The
  # signature says the image came from this repository's OIDC identity; it does
  # not say what built it.
  #
  # To restore it, one line — `with: private-repository: true` — and the
  # understanding that the repository name goes public. Worth knowing before
  # deciding: cosign's keyless signing above ALREADY writes this repository's
  # workflow identity to the same public Rekor log, so the override changes the
  # amount published, not the fact of it.
