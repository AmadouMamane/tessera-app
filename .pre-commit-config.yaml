# Ruff and mypy run through `uv run` so the hooks use the exact same versions,
# config, and resolved dependencies as the `uv run` quality gate. The previous
# hosted mirror hooks ran in isolated envs without the project deps (false mypy
# errors) and with a drifting ruff version. Check-only — they never rewrite
# files, so CI never fails with "files were modified by this hook".
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format check)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # eval/reports/local/*.json are generated eval-run archives (some
        # deliberately kept as evidence, see git log "chore(eval): archive
        # ..."); webapp/frontend/data/eval/*.json is a curated, build-time
        # snapshot baked into the Cloud Run image (webapp/frontend/lib/eval.ts).
        # Neither is hand-edited text, so this hook shouldn't govern them —
        # rewriting archived-evidence bytes after the fact is worse than
        # excluding a generated/curated data directory.
        exclude: ^(eval/reports/|webapp/frontend/data/eval/)
      - id: trailing-whitespace
      - id: check-yaml
        args: [--unsafe]  # syntax-only: allow docker-compose custom tags (!reset/!override)
      - id: check-added-large-files
        args: [--maxkb=500]
