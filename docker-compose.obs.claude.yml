# Claude-Powered observability stack (ADR 0010) — INDEPENDENT build.
#
# Deliberately separate from the shared docker-compose.yml so it never conflicts
# with parallel work by other agents. Every container/volume is prefixed
# `tessera-claude-*`, on the dedicated `tessera-claude-obs` network, bound to the
# Claude-Powered port-map — avoiding 3090/3190 and the base Tessera ports, AND
# the other agents' live Langfuse stack (5433/6379/9001/9002).
#
# `name:` pins an explicit Compose *project* so up/down operate ONLY on these
# containers — never on the shared `tessera` project other agents run in.
#
# Usage:
#   make obs-secrets     # once — writes .env.obs.local (gitignored) with RANDOM credentials
#   make obs-up          # refuses to start if any credential is unset
#   Point the agent at the Collector: TESSERA_OBSERVABILITY__OTEL_COLLECTOR_ENDPOINT=http://localhost:4418
# Backends (loopback by default — see the ports note below):
#   Phoenix (canonical)   http://127.0.0.1:16006
#   Langfuse (2nd export) http://127.0.0.1:3900     login: see .env.obs.local
#   Prometheus (ops)      http://127.0.0.1:19090
#   Grafana (SLO boards)  http://127.0.0.1:13000    login: see .env.obs.local
#
# ── THIS STACK HOLDS THE LLM TRACES. THE LLM TRACES ARE CUSTOMER CONVERSATIONS. ──────────────
#
# Every credential below used to be a LITERAL, and every port was published as `"3900:3000"` —
# which Docker binds to 0.0.0.0, i.e. EVERY interface. So on any shared network (an office LAN,
# a café wifi) a stranger could open Langfuse on :3900 with `claude@tessera.local / claude-demo-pw`
# — a password readable on GitHub — and read every transcript. ClickHouse (where those transcripts
# are STORED) answered on :18123 with clickhouse/clickhouse; MinIO on :19100 with minio/miniosecret.
# `ENCRYPTION_KEY` — what Langfuse encrypts sensitive fields with — was SIXTY-FOUR ZEROS.
#
# That is **F-9** ("default accounts stay valid when the env vars are missing"), closed in the app
# and left wide open in the plane that holds the transcripts. The question is never "is this
# production?" — it is **"can a stranger reach it?"**, and the answer was yes, by default, today.
#
# Two changes, and neither has an escape hatch that trades away security:
#
#   1. EVERY credential is `${VAR:?…}` — Compose's MANDATORY-variable form. Unset ⇒ Compose
#      REFUSES TO START and names what is missing. There is no default, because **a default that
#      IS a credential is the bug**. `make obs-secrets` writes RANDOM ones into a gitignored
#      `.env.obs.local`: the escape hatch removes the TYPING, never the security.
#   2. Every port binds `${TESSERA_OBS_BIND:-127.0.0.1}` — LOOPBACK by default. Publishing to the
#      network is now a deliberate, declared act (`TESSERA_OBS_BIND=0.0.0.0`), not what you get by
#      forgetting. A bind address is not a credential, so it is allowed a default — the SAFE one.

name: tessera-claude

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${TESSERA_OBS_LANGFUSE_DB_PASSWORD:?set it, or run `make obs-secrets`}@langfuse-db:5432/langfuse
  SALT: ${TESSERA_OBS_SALT:?set it, or run `make obs-secrets`}
  ENCRYPTION_KEY: ${TESSERA_OBS_ENCRYPTION_KEY:?64 hex chars — `openssl rand -hex 32`, or run `make obs-secrets`}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${TESSERA_OBS_CLICKHOUSE_PASSWORD:?set it, or run `make obs-secrets`}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${TESSERA_OBS_MINIO_PASSWORD:?set it, or run `make obs-secrets`}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${TESSERA_OBS_REDIS_PASSWORD:?set it, or run `make obs-secrets`}

services:
  # ── Vendor-neutral hub ──────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: tessera-claude-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/collector.onprem.yaml"]
    environment:
      # Basic-auth header for the Langfuse OTLP exporter (base64 of
      # "<public-key>:<secret-key>"); matches the LANGFUSE_INIT_* keys below.
      # `make obs-secrets` derives it from the very pair it generates, so the two cannot drift.
      LANGFUSE_OTEL_BASIC_AUTH: ${TESSERA_OBS_LANGFUSE_OTEL_BASIC_AUTH:?run `make obs-secrets` — it derives this from the key pair}
    volumes:
      - ./infra/observability/otel-collector/collector.onprem.yaml:/etc/otelcol-contrib/collector.onprem.yaml:ro
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:4417:4317" # OTLP gRPC
      - "${TESSERA_OBS_BIND:-127.0.0.1}:4418:4318" # OTLP HTTP
      - "${TESSERA_OBS_BIND:-127.0.0.1}:18888:8888" # Collector internal telemetry
    depends_on:
      phoenix:
        condition: service_started
    networks: [tessera-claude-obs]

  # ── Canonical LLM-observability backend ─────────────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: tessera-claude-phoenix
    restart: unless-stopped
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:16006:6006" # UI + OTLP/HTTP
      # 4317 (OTLP gRPC) stays internal; the Collector reaches it by name.
    networks: [tessera-claude-obs]

  # ── My own Langfuse v3 (2nd fan-out exporter) ───────────────────────────────
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: tessera-claude-langfuse
    restart: unless-stopped
    depends_on: &langfuse-deps
      langfuse-db: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3900
      NEXTAUTH_SECRET: ${TESSERA_OBS_NEXTAUTH_SECRET:?set it, or run `make obs-secrets`}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: claude-org
      LANGFUSE_INIT_PROJECT_ID: claude-project
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${TESSERA_OBS_LANGFUSE_PUBLIC_KEY:?set it, or run `make obs-secrets`}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${TESSERA_OBS_LANGFUSE_SECRET_KEY:?set it, or run `make obs-secrets`}
      LANGFUSE_INIT_USER_EMAIL: claude@tessera.local
      LANGFUSE_INIT_USER_NAME: Claude Powered
      LANGFUSE_INIT_USER_PASSWORD: ${TESSERA_OBS_LANGFUSE_USER_PASSWORD:?set it, or run `make obs-secrets`}
    ports:
      # THE TRANSCRIPTS ARE BEHIND THIS PORT. Loopback unless someone says otherwise, out loud.
      - "${TESSERA_OBS_BIND:-127.0.0.1}:3900:3000"
    networks: [tessera-claude-obs]

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: tessera-claude-langfuse-worker
    restart: unless-stopped
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
    networks: [tessera-claude-obs]

  langfuse-db:
    image: postgres:16
    container_name: tessera-claude-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${TESSERA_OBS_LANGFUSE_DB_PASSWORD:?set it, or run `make obs-secrets`}
      POSTGRES_DB: langfuse
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:55433:5432"
    volumes:
      - claude_langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tessera-claude-obs]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tessera-claude-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      # This is where the transcripts are actually STORED.
      CLICKHOUSE_PASSWORD: ${TESSERA_OBS_CLICKHOUSE_PASSWORD:?set it, or run `make obs-secrets`}
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:18123:8123"
      - "${TESSERA_OBS_BIND:-127.0.0.1}:19000:9000"
    volumes:
      - claude_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [tessera-claude-obs]

  minio:
    image: minio/minio:latest
    container_name: tessera-claude-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${TESSERA_OBS_MINIO_PASSWORD:?set it, or run `make obs-secrets`}
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:19100:9000"
      - "${TESSERA_OBS_BIND:-127.0.0.1}:19101:9001"
    volumes:
      - claude_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [tessera-claude-obs]

  redis:
    image: redis:7-alpine
    container_name: tessera-claude-redis
    restart: unless-stopped
    command: --requirepass ${TESSERA_OBS_REDIS_PASSWORD:?set it, or run `make obs-secrets`}
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "AUTH", "${TESSERA_OBS_REDIS_PASSWORD:?set it, or run `make obs-secrets`}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tessera-claude-obs]

  # ── Ops metrics — Prometheus + Grafana (SLO dashboards) ─────────────────────
  # Prometheus scrapes the agent's own /metrics exporter (tessera_* business
  # metrics) on the host via host.docker.internal:9090, plus the Collector's
  # internal telemetry. Grafana renders the pre-provisioned ops dashboard.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tessera-claude-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle" # POST /-/reload to hot-reload recording rules (ADR 0015)
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - claude_prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:19090:9090"
    networks: [tessera-claude-obs]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: tessera-claude-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # This line used to read `${GF_ADMIN_PASSWORD:-changeme}`, under a comment that said
      # "No hardcoded credential in the repo". `changeme` IS a hardcoded credential, and the
      # comment was a FALSE ASSURANCE sitting directly on top of the thing it denied — which is
      # more dangerous than the password, because it stops the next reader from looking.
      GF_SECURITY_ADMIN_PASSWORD: ${TESSERA_OBS_GRAFANA_PASSWORD:?set it, or run `make obs-secrets`}
      # ⚠ ANONYMOUS VIEWER IS ON: anyone who can REACH Grafana reads the dashboards with no login
      # at all. Left enabled deliberately — the boards are ops metrics, not transcripts, and the
      # port is now loopback-only — but it is why the bind address is not a detail: flip
      # TESSERA_OBS_BIND to 0.0.0.0 and this becomes a public read.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - claude_grafana:/var/lib/grafana
    ports:
      - "${TESSERA_OBS_BIND:-127.0.0.1}:13000:3000"
    networks: [tessera-claude-obs]

volumes:
  claude_langfuse_pg:
  claude_clickhouse:
  claude_minio:
  claude_prometheus:
  claude_grafana:

networks:
  tessera-claude-obs:
    name: tessera-claude-obs
