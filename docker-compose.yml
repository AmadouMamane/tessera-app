# Local-only stack for the README quickstart.
# Production uses Cloud Run + Cloud SQL — see infra/terraform/.
#
# Environment isolation (ADR 0014, layer 2): every identity below derives from
# ${TESSERA_ENV} so two environments compose up *simultaneously* without
# colliding. The top-level project name makes each env its own compose project —
# its own network and volume namespace — the same mechanism that already
# isolates the prod-refinement stack from dev. Defaults reproduce the historical
# `local` stack, so a bare `docker compose up` is unchanged.
#
#   TESSERA_ENV=staging TESSERA_PG_PORT=5433 TESSERA_AGENT_PORT=8100 \
#   TESSERA_FRONTEND_PORT=3091 docker compose --profile full up
#
# Telemetry stacks are deliberately NOT defined here: dev uses
# docker-compose.obs.claude.yml (collector on :4418), prod-refinement ships its
# own. The agent points at the right one via TESSERA_OTEL_COLLECTOR_ENDPOINT
# (empty default = export off, as today).
#
# Ports: the datastore binds ${TESSERA_BIND:-127.0.0.1} — LOOPBACK by default.
# A bare "5432:5432" is what Docker binds to 0.0.0.0, i.e. EVERY interface: on
# 2026-07-15 this exact stack (audit ledger, conversation transcripts, GDPR
# long-term memory — credentials published in this file) answered any host on
# the LAN. This is F-9 at the base compose, the same class the obs stack closed
# on 2026-07-14. Publishing to the network stays possible, but only as a
# deliberate, declared act (`TESSERA_BIND=0.0.0.0 docker compose up`), never as
# what you get by forgetting. Enforced over every docker-compose*.yml in the
# repo by tests/unit/test_compose_datastores_bind_loopback.py.
name: tessera-${TESSERA_ENV:-local}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tessera-${TESSERA_ENV:-local}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    ports:
      - "${TESSERA_BIND:-127.0.0.1}:${TESSERA_PG_PORT:-5432}:5432"
    volumes:
      - tessera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Ollama (containerised — CPU only on Mac, no Metal GPU access).
  # Use this for fully reproducible dev environments or CI.
  # For GPU-accelerated inference on Apple Silicon, run Ollama natively:
  #   brew install ollama && ollama serve && ollama pull llama3.3:70b
  # ---------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: tessera-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "${TESSERA_BIND:-127.0.0.1}:11434:11434"
  #   volumes:
  #     - tessera_ollama:/root/.ollama
  #   entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull llama3.3:70b && wait"]
  #   profiles: ["full", "cpu-only"]

  agent:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.agent
      # Same provenance stamp as the frontend, from the SAME variable. Both halves of a
      # deployment must be able to name the commit they came from, or `/api/version` reports a
      # SHA for a pair it has only half seen — a witness that says "match" about a front it
      # checked and an agent it did not.
      args:
        TESSERA_BUILD_SHA: ${TESSERA_BUILD_SHA:-}
    image: tessera-agent:local
    container_name: tessera-${TESSERA_ENV:-local}-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TESSERA_ENVIRONMENT: ${TESSERA_ENV:-local}
      TESSERA_LLM_PROFILE: on_prem
      TESSERA_POSTGRES__DSN: postgresql://tessera:tessera@postgres:5432/tessera
      TESSERA_OBSERVABILITY__LOG_FORMAT: console
      TESSERA_OBSERVABILITY__METRICS_ENABLED: "false"
      # Per-env telemetry: empty = export off (today's default). Point dev at the
      # claude obs stack (http://host.docker.internal:4418); prod-refinement sets
      # its own. The telemetry stacks themselves stay in their own compose files.
      TESSERA_OBSERVABILITY__OTEL_COLLECTOR_ENDPOINT: "${TESSERA_OTEL_COLLECTOR_ENDPOINT:-}"
      TESSERA_OLLAMA__HOST: "http://host.docker.internal:11434"
      # Close /docs and /openapi.json: this agent is reachable via a public
      # tunnel, and the schema would otherwise expose the full route surface.
      TESSERA_API__EXPOSE_DOCS: "false"
      # Cross-session long-term memory (ADR 0007, Tier 2), keyed by subject_id.
      # Without these the container defaults to the per-conversation window
      # backend, so facts stated in one conversation are not recalled in the next.
      TESSERA_MEMORY__BACKEND: persistent
      # DEMO ONLY: auto-grant retention consent so cross-session recall works
      # without a consent UI. Production MUST gather consent explicitly.
      TESSERA_MEMORY__CONSENT_DEFAULT: "true"
    # Service-to-service auth secret (TESSERA_API__BEARER_TOKEN) and forwarded-
    # header trust live in this gitignored file — never committed, and kept out
    # of the root .env/.env.local so the app's Settings (and tests) don't read
    # it. Absent → auth disabled (CI/local-open posture).
    env_file:
      - path: agent.secret.env
        required: false
    ports:
      # Host 8099 (local convenience, avoids conflicts) -> container's default 8080.
      - "${TESSERA_AGENT_PORT:-8099}:8080"
    volumes:
      # Persist the file audit log (/tmp/tessera/audit.log) and the budget
      # tracker (/tmp/tessera/budget.json) across container recreation, so the
      # audit trail and token/cost counters accumulate instead of resetting.
      - tessera_agent_state:/tmp/tessera
    profiles: ["full"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      # Bake build provenance into the image so /api/version can report it (ADR 0048).
      # Defaults keep an un-stamped local build honest (sha=dev). For a parity build,
      # pass the real SHA: TESSERA_BUILD_SHA=$(git rev-parse --short HEAD).
      args:
        TESSERA_BUILD_SHA: ${TESSERA_BUILD_SHA:-dev}
        TESSERA_BUILD_TIME: ${TESSERA_BUILD_TIME:-unknown}
        TESSERA_TARGET: ${TESSERA_TARGET:-onprem}
    # The ONE image both targets run (ADR 0048). Unset → the local-build tag; set to the registry
    # SHA tag Cloud Run runs to pull the SAME bytes instead of building locally (parity mode).
    image: ${TESSERA_FRONTEND_IMAGE:-tessera-frontend:local}
    container_name: tessera-${TESSERA_ENV:-local}-frontend
    depends_on:
      agent:
        condition: service_healthy
    environment:
      # In-network the agent is reachable by service name on its container port
      # 8080 (the 8099 host mapping is for local convenience only).
      TESSERA_BACKEND_URL: http://agent:8080
    # Bearer token for the server-side proxy calls; must match the agent's
    # TESSERA_API__BEARER_TOKEN. Gitignored, never committed. Absent → the proxy
    # sends no Authorization header and the agent returns 401 when auth is on.
    env_file:
      - path: frontend.secret.env
        required: false
    ports:
      # Host 3090 avoids clashing with the bare `next dev` server on 3099 (kept
      # for non-container local testing behind the Cloudflare quick tunnel).
      - "${TESSERA_FRONTEND_PORT:-3090}:3000"
    profiles: ["full"]

volumes:
  tessera_pgdata:
  tessera_agent_state:
  # tessera_ollama:  # uncomment when using the containerised Ollama service
