<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .t{fill:#E6EAF2}.mut{fill:#8A94A6}.dim{fill:#5A6478}.ac{fill:#2DD4BF}.grn{fill:#22C55E}.amb{fill:#F59E0B}.red{fill:#EF4444}
    .card{fill:#121A2A;stroke:#1E2A3E;stroke-width:1}
    .sec{fill:#0F1726;stroke:#1B2638;stroke-width:1}
    .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
    .arr{stroke:#3A4A63;stroke-width:1.6;fill:none;marker-end:url(#ah)}
    .arrc{stroke:#2DD4BF;stroke-width:1.6;fill:none;marker-end:url(#ahc)}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3A4A63"/></marker>
    <marker id="ahc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2DD4BF"/></marker>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#0A0E18"/>

  <!-- title -->
  <text x="40" y="46" class="t" font-size="24" font-weight="700">S1 · Journal d'événements</text>
  <rect x="372" y="28" width="186" height="24" rx="12" fill="#10241C" stroke="#1c5a44"/>
  <text x="465" y="44" class="grn" font-size="11" text-anchor="middle" font-weight="600">bitemporal · hash-chaîné</text>
  <text x="40" y="72" class="mut" font-size="12.5">Le substrat de TE-01 / OT-01 / AT-01 — ce qui rend « opposable » vrai, pas décoratif.</text>

  <!-- ===== 1. Event ===== -->
  <rect x="40" y="96" width="408" height="372" rx="12" class="card"/>
  <text x="60" y="126" class="t" font-size="14" font-weight="700">1 · Événement <tspan class="dim" font-weight="400" font-size="11">(append-only)</tspan></text>
  <g class="mono" font-size="11.5">
    <text x="60" y="156" class="mut">event_id</text><text x="200" y="156" class="dim">ULID</text>
    <text x="60" y="180" class="ac">prev_hash</text><text x="200" y="180" class="dim">→ chaînage</text>
    <text x="60" y="204" class="ac">hash</text><text x="200" y="204" class="dim">H(prev_hash ‖ payload)</text>
    <text x="60" y="228" class="mut">tenant · agent_id</text>
    <text x="60" y="252" class="mut">entity_type</text><text x="200" y="252" class="dim">source|garde_fou|prompt…</text>
    <text x="60" y="276" class="mut">entity_id · op</text><text x="200" y="276" class="dim">attached|version_indexed…</text>
    <text x="60" y="300" class="mut">payload</text><text x="200" y="300" class="dim">{ version, before, after }</text>
  </g>
  <line x1="60" y1="318" x2="428" y2="318" stroke="#1B2638"/>
  <rect x="56" y="330" width="376" height="84" rx="8" fill="#1B160A" stroke="#3a2c12"/>
  <text x="68" y="350" class="amb" font-size="10.5" font-weight="700">BITEMPOREL</text>
  <g class="mono" font-size="11.5">
    <text x="68" y="372" class="amb">valid_from / valid_to</text><text x="280" y="372" class="dim">effectif pour l'agent</text>
    <text x="68" y="394" class="amb">recorded_at</text><text x="280" y="394" class="dim">connu de Tessera</text>
  </g>
  <text x="60" y="440" class="mut mono" font-size="11">actor</text><text x="200" y="440" class="dim mono" font-size="11">user | system</text>
  <text x="60" y="460" class="red" font-size="10.5">Jamais d'UPDATE/DELETE — une correction = un nouvel événement.</text>

  <!-- ===== 2. Hash chain ===== -->
  <rect x="470" y="96" width="486" height="222" rx="12" class="card"/>
  <text x="490" y="126" class="t" font-size="14" font-weight="700">2 · Chaîne de hash <tspan class="dim" font-weight="400" font-size="11">(immuable)</tspan></text>
  <!-- blocks -->
  <g>
    <rect x="490" y="150" width="86" height="52" rx="8" class="sec"/>
    <text x="533" y="172" class="mut mono" font-size="11" text-anchor="middle">e₁</text>
    <text x="533" y="190" class="ac mono" font-size="9" text-anchor="middle">a91f…</text>
    <rect x="606" y="150" width="86" height="52" rx="8" class="sec"/>
    <text x="649" y="172" class="mut mono" font-size="11" text-anchor="middle">e₂</text>
    <text x="649" y="190" class="ac mono" font-size="9" text-anchor="middle">c3d2…</text>
    <rect x="722" y="150" width="86" height="52" rx="8" class="sec"/>
    <text x="765" y="172" class="mut mono" font-size="11" text-anchor="middle">e₃</text>
    <text x="765" y="190" class="ac mono" font-size="9" text-anchor="middle">7f3a…</text>
    <rect x="838" y="150" width="100" height="52" rx="8" fill="#0E2A26" stroke="#2DD4BF"/>
    <text x="888" y="170" class="ac mono" font-size="11" text-anchor="middle" font-weight="700">e_head</text>
    <text x="888" y="190" class="ac mono" font-size="9" text-anchor="middle">9f…b21c</text>
  </g>
  <path class="arrc" d="M576 176 L604 176"/>
  <path class="arrc" d="M692 176 L720 176"/>
  <path class="arrc" d="M808 176 L836 176"/>
  <text x="490" y="232" class="dim" font-size="10">chaque bloc référence le <tspan class="ac">prev_hash</tspan> du précédent</text>
  <rect x="490" y="246" width="448" height="56" rx="8" fill="#1A1012" stroke="#3a1c20"/>
  <text x="504" y="268" class="red" font-size="11" font-weight="700">Tamper-evident</text>
  <text x="504" y="288" class="mut" font-size="10.5">altérer un événement recalcule son hash → casse toute la chaîne en aval.</text>
  <text x="838" y="232" class="ac" font-size="10" font-weight="700">head_hash = sceau</text>

  <!-- ===== Bitemporal inset ===== -->
  <rect x="470" y="330" width="486" height="138" rx="12" class="card"/>
  <text x="490" y="358" class="t" font-size="13" font-weight="700">Bitemporal — deux axes</text>
  <!-- axes -->
  <line x1="520" y1="446" x2="520" y2="374" stroke="#3A4A63" stroke-width="1.4"/>
  <line x1="520" y1="446" x2="930" y2="446" stroke="#3A4A63" stroke-width="1.4"/>
  <text x="512" y="372" class="dim" font-size="9" text-anchor="end">transaction</text>
  <text x="930" y="462" class="dim" font-size="9" text-anchor="end">valid_time →</text>
  <!-- valid interval bar -->
  <rect x="600" y="404" width="210" height="10" rx="5" fill="#2DD4BF" opacity="0.5"/>
  <text x="600" y="398" class="ac mono" font-size="9">valid_from</text>
  <text x="810" y="398" class="ac mono" font-size="9" text-anchor="end">valid_to</text>
  <!-- T line -->
  <line x1="700" y1="378" x2="700" y2="452" stroke="#F59E0B" stroke-dasharray="3 3" stroke-width="1.3"/>
  <text x="700" y="462" class="amb mono" font-size="9" text-anchor="middle">T</text>
  <circle cx="700" cy="409" r="4" fill="#F59E0B"/>
  <text x="950" y="392" class="dim" font-size="10">valid = effectif</text>
  <text x="950" y="392" class="dim" font-size="10"></text>
  <text x="610" y="436" class="grn mono" font-size="9.5">à T : valid_from ≤ T &lt; valid_to → pris</text>

  <!-- ===== 3. as-of query ===== -->
  <rect x="978" y="96" width="422" height="150" rx="12" class="card"/>
  <text x="998" y="126" class="t" font-size="14" font-weight="700">3 · Requête as-of</text>
  <rect x="998" y="140" width="382" height="86" rx="8" fill="#0F1726"/>
  <g class="mono" font-size="11">
    <text x="1012" y="162" class="ac">state(agent, T) =</text>
    <text x="1024" y="182" class="mut">pour chaque entité :</text>
    <text x="1036" y="202" class="t">dernier event où valid_from ≤ T</text>
    <text x="1036" y="218" class="t">et (valid_to null ou T &lt; valid_to)</text>
  </g>

  <!-- arrow down to snapshot -->
  <path class="arr" d="M1189 246 L1189 270"/>

  <!-- Snapshot card -->
  <rect x="978" y="276" width="422" height="192" rx="12" fill="#0E1E1A" stroke="#16382c"/>
  <text x="998" y="304" class="t" font-size="13" font-weight="700">Snapshot à T <tspan class="dim" font-weight="400" font-size="11">= État à date</tspan></text>
  <g font-size="11.5">
    <text x="998" y="330" class="mut">Sources</text><text x="1380" y="330" class="ac mono" font-size="11" text-anchor="end">@ v3.1 · …</text>
    <text x="998" y="354" class="mut">Garde-fous</text><text x="1380" y="354" class="ac mono" font-size="11" text-anchor="end">bundle v2.4</text>
    <text x="998" y="378" class="mut">Prompt</text><text x="1380" y="378" class="ac mono" font-size="11" text-anchor="end">v1.4.7</text>
    <text x="998" y="402" class="mut">Modèle</text><text x="1380" y="402" class="ac mono" font-size="11" text-anchor="end">Llama 3.2 3B</text>
    <text x="998" y="426" class="mut">Release</text><text x="1380" y="426" class="ac mono" font-size="11" text-anchor="end">REL-2026.06.05+1</text>
    <text x="998" y="450" class="mut">Connecteurs · politiques</text><text x="1380" y="450" class="ac mono" font-size="11" text-anchor="end">RBAC · PII</text>
  </g>

  <!-- ===== projections band ===== -->
  <text x="40" y="512" class="t" font-size="14" font-weight="700">Mêmes données — trois projections <tspan class="dim" font-weight="400" font-size="11">(un journal, plusieurs lectures)</tspan></text>
  <!-- TE -->
  <rect x="40" y="528" width="430" height="150" rx="12" class="card"/>
  <text x="60" y="556" class="ac" font-size="13" font-weight="700">TE-01 · As-of</text>
  <text x="60" y="580" class="mut" font-size="11.5">fold de tous les events où t ≤ T</text>
  <text x="60" y="600" class="dim" font-size="11">→ coupe transversale = le Snapshot à T</text>
  <text x="60" y="628" class="dim" font-size="10.5">PROUVER / État à date · preuve opposable</text>
  <!-- OT -->
  <rect x="490" y="528" width="430" height="150" rx="12" class="card"/>
  <text x="510" y="556" class="ac" font-size="13" font-weight="700">OT-01 · Object trace</text>
  <text x="510" y="580" class="mut" font-size="11.5">filtre events d'un seul entity_id</text>
  <text x="510" y="600" class="dim" font-size="11">→ historique local d'un objet</text>
  <text x="510" y="628" class="dim" font-size="10.5">Connaissances · Garde-fous · Prompts · Config</text>
  <!-- AT -->
  <rect x="940" y="528" width="460" height="150" rx="12" class="card"/>
  <text x="960" y="556" class="ac" font-size="13" font-weight="700">AT-01 · Activity</text>
  <text x="960" y="580" class="mut" font-size="11.5">slice récent du journal</text>
  <text x="960" y="600" class="dim" font-size="11">→ feed d'activité (pas les signaux → Surveiller)</text>
  <text x="960" y="628" class="dim" font-size="10.5">AGENT / Synthèse</text>
  <!-- arrows from a virtual log line -->
  <text x="60" y="660" class="dim mono" font-size="10">C1 · fold engine</text>
  <text x="510" y="660" class="dim mono" font-size="10">C1 · fold engine</text>
  <text x="960" y="660" class="dim mono" font-size="10">C1 · fold engine</text>

  <!-- ===== integrity footer ===== -->
  <rect x="40" y="700" width="1360" height="150" rx="12" class="sec"/>
  <text x="60" y="730" class="t" font-size="14" font-weight="700">Intégrité → Opposable</text>
  <!-- pipeline -->
  <rect x="60" y="748" width="150" height="58" rx="9" class="card"/>
  <text x="135" y="772" class="mut mono" font-size="11" text-anchor="middle">head_hash</text>
  <text x="135" y="790" class="ac mono" font-size="10" text-anchor="middle">9f…b21c</text>
  <path class="arr" d="M212 777 L262 777"/>
  <rect x="264" y="748" width="170" height="58" rx="9" class="card"/>
  <text x="349" y="772" class="t" font-size="11" text-anchor="middle" font-weight="600">verify(chain)</text>
  <text x="349" y="790" class="grn" font-size="10" text-anchor="middle">recalcul → OK</text>
  <path class="arr" d="M436 777 L486 777"/>
  <rect x="488" y="748" width="190" height="58" rx="9" class="card"/>
  <text x="583" y="772" class="t" font-size="11" text-anchor="middle" font-weight="600">sceau tiers · Hica</text>
  <text x="583" y="790" class="mut" font-size="10" text-anchor="middle">signe (head_hash, T)</text>
  <path class="arr" d="M680 777 L730 777"/>
  <rect x="732" y="746" width="170" height="62" rx="10" fill="#10241C" stroke="#1c5a44"/>
  <text x="817" y="772" class="grn" font-size="13" text-anchor="middle" font-weight="700">Scellé</text>
  <text x="817" y="792" class="grn" font-size="10" text-anchor="middle">opposable</text>
  <!-- guard note -->
  <rect x="936" y="744" width="440" height="66" rx="9" fill="#1A1012" stroke="#3a1c20"/>
  <text x="954" y="768" class="red" font-size="11" font-weight="700">Garde-fou</text>
  <text x="954" y="788" class="mut" font-size="10.5">le badge n'apparaît QUE si verify passe.</text>
  <text x="954" y="803" class="dim" font-size="10">Sinon → « Non scellé ». Jamais cosmétique.</text>

  <text x="60" y="836" class="dim" font-size="10.5" font-style="italic">Un journal append-only, hash-chaîné, bitemporal — quatre projections (C1·C2·C3·C4), preuve re-vérifiable.</text>
</svg>
