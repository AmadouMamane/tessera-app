  <text x="958" y="430" class="t3" font-size="11">staleness des golden answers : 0 périmée (#82)</text>
  <text x="958" y="450" class="t3" font-size="11">rendement annotation : à mesurer (#97)</text>

  <rect x="240" y="494" width="1016" height="64" rx="10" class="s"/>
