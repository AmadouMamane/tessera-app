  <rect x="640" y="248" width="96" height="20" rx="10" class="bw"/>
  <text x="652" y="262" class="tw" font-size="11" font-weight="600">prédit ✗</text>
  <text x="258" y="284" class="t3" font-size="11">raisons : flaggé par le pré-juge (#121) · intent inconnu au router</text>
  <text x="258" y="302" class="t3" font-size="11">thème suggéré : intent_coverage · cible : 65_sepa_intent.json</text>
  <rect x="752" y="248" width="92" height="26" rx="10" fill="#ffffff" stroke="#0f6e56"/>
  <text x="770" y="266" class="ts" font-size="12" font-weight="600">Accepter</text>
  <rect x="752" y="282" width="92" height="26" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
  <text x="774" y="300" class="t2" font-size="12">Rejeter</text>
  <rect x="240" y="338" width="672" height="92" rx="10" class="s"/>
  <text x="258" y="364" class="t1" font-weight="600">Tour de-11:03 — « Kartensperrung » (session shadow)</text>
  <rect x="640" y="350" width="96" height="20" rx="10" class="bw"/>
  <text x="652" y="364" class="tw" font-size="11" font-weight="600">désaccord</text>
  <text x="258" y="386" class="t3" font-size="11">raisons : juges 0.30 vs 0.75 · routé vers annotation humaine (#6)</text>
  <text x="258" y="404" class="t3" font-size="11">en attente d'annotation — IAA requis avant acceptation (#55)</text>
  <rect x="752" y="350" width="92" height="26" rx="10" fill="none" stroke="#c9c7c0" stroke-dasharray="4 3"/>
  <text x="762" y="368" class="t3" font-size="11">en attente</text>
  <rect x="240" y="440" width="672" height="34" rx="8" class="s"/>
  <text x="258" y="462" class="t2" font-size="12">▸ 8 autres candidats — score faible 1 · prédits 6 · désaccord 1</text>

  <rect x="940" y="134" width="316" height="180" rx="10" class="s"/>
  <text x="958" y="160" class="t1" font-size="14" font-weight="600">Flywheel SFT</text>
  <text x="958" y="186" class="t2" font-size="12">éligibles : 1 tour (score ≥ 0.80, FR)</text>
  <text x="958" y="208" class="t3" font-size="11">les bons tours deviennent des données</text>
  <text x="958" y="224" class="t3" font-size="11">d'entraînement du modèle local (#122)</text>
  <rect x="958" y="240" width="180" height="30" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
  <text x="976" y="260" class="t1" font-size="12" font-weight="600">Exporter en parquet</text>
  <text x="958" y="296" class="t3" font-size="11">dernier export : jamais · 0 dataset publié</text>

  <rect x="940" y="334" width="316" height="140" rx="10" class="s"/>
  <text x="958" y="360" class="t1" font-size="14" font-weight="600">Santé de l'eval set</text>
  <text x="958" y="386" class="t2" font-size="12">63 cas · 6 thèmes · pureté 54%</text>
  <rect x="1148" y="372" width="92" height="20" rx="10" class="bw"/>
  <text x="1160" y="386" class="tw" font-size="11" font-weight="600">re-cluster</text>
