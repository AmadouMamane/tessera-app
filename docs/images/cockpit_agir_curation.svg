  <text x="258" y="200" class="t3" font-size="11">thème suggéré : hallucination · cible : 64_deposit_guarantee.json</text>
  <rect x="752" y="146" width="92" height="26" rx="10" fill="#ffffff" stroke="#0f6e56"/>
  <text x="770" y="164" class="ts" font-size="12" font-weight="600">Accepter</text>
  <rect x="752" y="180" width="92" height="26" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
