  <text x="258" y="542" class="t2" font-size="12">prod → exception → curation → eval/failures/ → gate CI (#9) → le même échec ne revient jamais silencieusement</text>

  <rect x="240" y="578" width="1016" height="56" rx="10" fill="none" stroke="#c9c7c0" stroke-dasharray="4 3"/>
  <text x="258" y="602" class="t2" font-size="12">#175 — auto-tickets Jira/ServiceNow depuis les clusters · #176 — webhooks pour outils d'annotation externes</text>
  <text x="258" y="622" class="t3" font-size="11">planifié — intégrations sortantes du flywheel</text>
