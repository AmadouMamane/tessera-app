<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Tessera cockpit — replay et shadow</title>
  <style>
    .s{fill:#ffffff;stroke:#e3e1db;stroke-width:1}
    .t1{fill:#1a1915}.t2{fill:#5f5e5a}.t3{fill:#969590}
    .td{fill:#a32d2d}.ts{fill:#0f6e56}.tw{fill:#854f0b}.ti{fill:#185fa5}.tp{fill:#3c3489}
    .bd{fill:#fcebeb}.bs{fill:#e1f5ee}.bw{fill:#faeeda}.bi{fill:#e6f1fb}.bp{fill:#eeedfe}.bg{fill:#f1efe8}
    .mono{font-family:'SF Mono', Menlo, monospace}
    text{font-size:13px}
  </style>
  <rect width="1280" height="800" fill="#f7f6f3"/>
  <rect width="1280" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="1280" y2="52" stroke="#e3e1db"/>
  <text x="24" y="33" class="t1" font-size="16" font-weight="600">Tessera</text>
  <rect x="110" y="14" width="112" height="24" rx="12" class="bg"/>
  <text x="128" y="30" class="t3" font-size="11">CI</text>
  <rect x="152" y="16" width="66" height="20" rx="10" fill="#ffffff" stroke="#e3e1db"/>
  <text x="166" y="30" class="t1" font-size="11" font-weight="600">Prod</text>
  <rect x="238" y="14" width="44" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="251" y="30" class="t2" font-size="11">7 j</text>
  <rect x="290" y="14" width="40" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="302" y="30" class="t2" font-size="11">FR</text>
  <rect x="338" y="14" width="98" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="350" y="30" class="t2" font-size="11">llama3.2:3b</text>
  <rect x="1006" y="14" width="148" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="1020" y="30" class="t3" font-size="11">⌘K · 200 signaux</text>
  <rect x="1166" y="14" width="90" height="24" rx="12" class="bp"/>
  <text x="1182" y="30" class="tp" font-size="11" font-weight="600">operator</text>

  <rect x="0" y="52" width="216" height="748" fill="#ffffff"/>
  <line x1="216" y1="52" x2="216" y2="800" stroke="#e3e1db"/>
  <text x="20" y="88" class="t3" font-size="11">Produit</text>
  <text x="20" y="112" class="t2">Assistant</text>
  <text x="20" y="140" class="t2">À traiter</text>
  <rect x="168" y="126" width="28" height="18" rx="9" class="bd"/>
  <text x="178" y="139" class="td" font-size="11" font-weight="600">3</text>
  <text x="20" y="170" class="t3" font-size="11">Surveiller</text>
  <text x="20" y="194" class="t2">Vue d'ensemble</text>
  <text x="20" y="220" class="t2">Qualité</text>
  <circle cx="196" cy="216" r="4" fill="#e24b4a"/>
  <text x="20" y="246" class="t2">Sécurité</text>
  <circle cx="196" cy="242" r="4" fill="#ef9f27"/>
  <text x="20" y="272" class="t2">Conformité</text>
  <circle cx="196" cy="268" r="4" fill="#1d9e75"/>
  <text x="20" y="298" class="t2">Fiabilité &amp; coût</text>
  <circle cx="196" cy="294" r="4" fill="#1d9e75"/>
  <text x="20" y="328" class="t3" font-size="11">Agir</text>
  <text x="20" y="352" class="t2">Incidents &amp; playbooks</text>
  <rect x="8" y="359" width="200" height="28" rx="8" class="bp"/>
  <text x="20" y="378" class="tp" font-weight="600">Replay &amp; shadow</text>
  <text x="20" y="404" class="t2">Curation eval set</text>
  <text x="20" y="434" class="t3" font-size="11">Plateforme</text>
  <text x="20" y="458" class="t2">Preuves &amp; exporteurs</text>
  <text x="20" y="484" class="t2">Registre des signaux</text>

  <text x="240" y="94" class="t1" font-size="19" font-weight="600">Replay &amp; shadow</text>
  <text x="430" y="94" class="t3" font-size="12">régression depuis la prod · sans impact utilisateur</text>
  <text x="240" y="114" class="t3" font-size="12">prérequis : reproductibilité 100% (#86) · graine, contexte et versions capturés (#10)</text>

  <rect x="240" y="134" width="640" height="300" rx="10" class="s"/>
  <text x="258" y="162" class="t1" font-size="15" font-weight="600">Replay — rejouer une trace de prod</text>
  <text x="258" y="186" class="t2 mono" font-size="11">trace 15dd4b7a2f7f · « Expliquez-moi la garantie des dépôts en France. » · FR</text>
  <text x="258" y="206" class="t3" font-size="11">prompt a4926fa4f0bf · policy 350975bc05bb · 10 docs identiques · graine fixée</text>
  <rect x="258" y="226" width="290" height="86" rx="10" class="bd"/>
  <text x="276" y="252" class="td" font-size="12" font-weight="600">original — llama3.2:3b</text>
  <text x="276" y="280" class="td" font-size="24" font-weight="600">0.10</text>
  <text x="276" y="300" class="td" font-size="11">invente frais d'incident et plafonds</text>
  <rect x="572" y="226" width="290" height="86" rx="10" class="bs"/>
  <text x="590" y="252" class="ts" font-size="12" font-weight="600">candidat — mistral:7b</text>
  <text x="590" y="280" class="ts" font-size="24" font-weight="600">0.85</text>
  <text x="590" y="300" class="ts" font-size="11">ancré sur les chunks récupérés</text>
  <text x="548" y="274" class="t1" font-size="18" font-weight="600">→</text>
  <rect x="258" y="330" width="120" height="24" rx="12" class="bs"/>
  <text x="272" y="346" class="ts" font-size="11" font-weight="600">Δ +0.75</text>
  <text x="392" y="346" class="t2" font-size="12">latence 361 ms → 1 041 ms (+680)</text>
  <rect x="258" y="374" width="220" height="32" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
  <text x="276" y="395" class="t1" font-size="12" font-weight="600">Rejouer sur un autre candidat</text>
  <rect x="492" y="374" width="200" height="32" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
  <text x="510" y="395" class="t1" font-size="12" font-weight="600">Exporter en cas d'éval</text>
  <text x="258" y="424" class="t3" font-size="11">chaque replay émet une preuve · le diff alimente la décision de migration (#151)</text>

  <rect x="920" y="134" width="336" height="300" rx="10" class="s"/>
  <text x="938" y="162" class="t1" font-size="15" font-weight="600">Shadow — trafic fantôme</text>
  <text x="938" y="186" class="t3" font-size="11">le candidat reçoit une copie du trafic réel</text>
  <text x="938" y="216" class="t3" font-size="11">candidat</text>
  <text x="938" y="236" class="t1" font-size="14" font-weight="600">mistral:7b</text>
  <text x="938" y="266" class="t3" font-size="11">traces répliquées</text>
  <text x="938" y="286" class="t1" font-size="14" font-weight="600">2/2</text>
  <text x="1080" y="266" class="t3" font-size="11">Δ qualité moyen</text>
  <rect x="1080" y="272" width="92" height="22" rx="11" class="bs"/>
  <text x="1092" y="287" class="ts" font-size="11" font-weight="600">+0.40</text>
  <text x="938" y="318" class="t3" font-size="11">Δ latence</text>
  <rect x="938" y="324" width="92" height="22" rx="11" class="bw"/>
  <text x="950" y="339" class="tw" font-size="11" font-weight="600">+680 ms</text>
  <rect x="938" y="366" width="190" height="32" rx="10" fill="#ffffff" stroke="#c9c7c0"/>
  <text x="956" y="387" class="t1" font-size="12" font-weight="600">Arrêter le shadow</text>
  <text x="938" y="424" class="t3" font-size="11">aucune réponse shadow ne part vers l'utilisateur</text>

  <rect x="240" y="454" width="640" height="56" rx="10" fill="none" stroke="#c9c7c0" stroke-dasharray="4 3"/>
  <text x="258" y="478" class="t2" font-size="12">#34 — promotion vers A/B/n avec significativité statistique + métriques garde-fou</text>
  <text x="258" y="498" class="t3" font-size="11">planifié — le shadow valide, l'A/B décide</text>
  <rect x="920" y="454" width="336" height="56" rx="10" class="s"/>
  <text x="938" y="478" class="t2" font-size="12">Golden traces : 2/2 conformes ✓</text>
  <text x="938" y="498" class="t3" font-size="11">le replay exige la forme golden (#41, #86)</text>

  <rect x="240" y="530" width="1016" height="64" rx="10" class="s"/>
  <text x="258" y="556" class="t1" font-size="13" font-weight="600">Pourquoi c'est la pièce maîtresse</text>
  <text x="258" y="578" class="t2" font-size="12">un échec de prod devient un cas de test exécutable : trace → replay → diff → eval set → gate CI — la boucle complète sans toucher au trafic réel (#1)</text>
</svg>
