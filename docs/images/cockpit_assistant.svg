<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Tessera — assistant (surface produit)</title>
  <style>
    .s{fill:#ffffff;stroke:#e3e1db;stroke-width:1}
    .t1{fill:#1a1915}.t2{fill:#5f5e5a}.t3{fill:#969590}
