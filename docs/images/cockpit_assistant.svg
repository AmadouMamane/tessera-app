  <rect x="300" y="84" width="700" height="40" rx="10" class="bi"/>
  <text x="320" y="109" class="ti" font-size="12">Tessera est un assistant IA. Vérifiez les informations importantes avant toute décision. — Art. 50</text>

  <rect x="560" y="148" width="440" height="44" rx="14" class="bg"/>
  <text x="582" y="175" class="t1" font-size="13">Expliquez-moi la garantie des dépôts en France.</text>

  <rect x="300" y="216" width="560" height="232" rx="14" class="s"/>
  <text x="322" y="246" class="t1" font-size="13">La garantie des dépôts est fixée à 100 000 € par déposant et</text>
  <text x="322" y="268" class="t1" font-size="13">par établissement. Elle est mise en œuvre par le FGDR dans un</text>
  <text x="322" y="290" class="t1" font-size="13">délai de 7 jours ouvrables.</text>
  <rect x="322" y="308" width="208" height="24" rx="12" class="bi"/>
  <text x="336" y="324" class="ti" font-size="11">Directive 2014/49/UE (DGSD) ↗</text>
  <rect x="542" y="308" width="120" height="24" rx="12" class="bi"/>
  <text x="556" y="324" class="ti" font-size="11">FGDR — fiche ↗</text>
  <line x1="322" y1="350" x2="838" y2="350" stroke="#e3e1db"/>
  <rect x="322" y="364" width="166" height="24" rx="12" class="bw"/>
  <text x="336" y="380" class="tw" font-size="11">confiance 59% — vérifier</text>
  <rect x="500" y="364" width="140" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="514" y="380" class="t2" font-size="11">voir les sources</text>
  <rect x="652" y="364" width="172" height="24" rx="12" fill="none" stroke="#e3e1db"/>
  <text x="666" y="380" class="t2" font-size="11">parler à un conseiller</text>
  <text x="322" y="420" class="t3" font-size="11">les passages incertains sont soulignés · l'incertitude vient de #12/#18</text>
  <text x="322" y="438" class="t3" font-size="11">escalade humaine : délai estimé 4 min · raison affichée (#136)</text>

  <rect x="300" y="472" width="700" height="40" rx="10" class="bg"/>
  <text x="320" y="497" class="t2" font-size="12">Mémorisé : vous préférez le français · communication écrite</text>
  <rect x="812" y="480" width="170" height="24" rx="12" fill="none" stroke="#c9c7c0"/>
  <text x="826" y="496" class="t2" font-size="11">gérer ma mémoire (GDPR)</text>

  <rect x="300" y="536" width="700" height="44" rx="14" class="s"/>
  <text x="322" y="563" class="t3" font-size="13">Écrivez votre message…</text>
  <rect x="912" y="544" width="76" height="28" rx="10" fill="#534ab7"/>
  <text x="936" y="563" fill="#ffffff" font-size="12" font-weight="600">Envoyer</text>
  <rect x="300" y="592" width="46" height="22" rx="11" class="bp"/>
  <text x="314" y="607" class="tp" font-size="11" font-weight="600">FR</text>
  <rect x="354" y="592" width="46" height="22" rx="11" fill="none" stroke="#e3e1db"/>
  <text x="368" y="607" class="t2" font-size="11">DE</text>
  <rect x="408" y="592" width="46" height="22" rx="11" fill="none" stroke="#e3e1db"/>
  <text x="422" y="607" class="t2" font-size="11">EN</text>

  <rect x="1032" y="84" width="224" height="300" rx="10" class="s"/>
  <text x="1050" y="110" class="t1" font-size="13" font-weight="600">Surfaces produit</text>
  <text x="1050" y="132" class="t3" font-size="11">issues du catalogue · page: produit</text>
  <text x="1050" y="160" class="t2" font-size="11">#134 disclosure Art. 50</text>
  <rect x="1196" y="148" width="44" height="18" rx="9" class="bs"/>
  <text x="1206" y="161" class="ts" font-size="10" font-weight="600">actif</text>
  <text x="1050" y="188" class="t2" font-size="11">#132 citations cliquables</text>
  <rect x="1196" y="176" width="44" height="18" rx="9" class="bs"/>
  <text x="1206" y="189" class="ts" font-size="10" font-weight="600">actif</text>
  <text x="1050" y="216" class="t2" font-size="11">#131 indicateur de confiance</text>
  <rect x="1190" y="204" width="52" height="18" rx="9" class="bg"/>
  <text x="1198" y="217" class="t3" font-size="10">planifié</text>
  <text x="1050" y="244" class="t2" font-size="11">#135 mémoire corrigeable</text>
  <rect x="1190" y="232" width="52" height="18" rx="9" class="bg"/>
  <text x="1198" y="245" class="t3" font-size="10">planifié</text>
  <text x="1050" y="272" class="t2" font-size="11">#136 escalade transparente</text>
  <rect x="1190" y="260" width="52" height="18" rx="9" class="bg"/>
  <text x="1198" y="273" class="t3" font-size="10">planifié</text>
  <text x="1050" y="304" class="t3" font-size="11">chaque surface émet ses signaux</text>
  <text x="1050" y="322" class="t3" font-size="11">vers le cockpit : disclosure vue,</text>
  <text x="1050" y="340" class="t3" font-size="11">citation cliquée, escalade, refus —</text>
  <text x="1050" y="358" class="t3" font-size="11">la frontière produit/cockpit en action</text>

  <rect x="300" y="640" width="956" height="56" rx="10" class="s"/>
  <text x="320" y="666" class="t1" font-size="13" font-weight="600">Ce que voit le cockpit pendant cette conversation</text>
  <text x="320" y="688" class="t2" font-size="12">guard : input screené ✓ · retrieval : 10 chunks · juge : faithfulness asynchrone · mémoire : 1 écriture gardée · trace : 8 spans signés</text>
