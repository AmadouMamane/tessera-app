  <rect x="240" y="524" width="500" height="120" rx="10" class="s"/>
  <text x="258" y="550" class="t1" font-size="14" font-weight="600">Couverture par page</text>
  <text x="258" y="576" class="t2" font-size="12">qualité 25/44 · sécurité 16/24 · fiabilité &amp; coût 12/39</text>
  <text x="258" y="598" class="t2" font-size="12">conformité 6/12 · agir 7/23 · plateforme 9/29</text>
