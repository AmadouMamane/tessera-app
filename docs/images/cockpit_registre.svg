  <rect x="756" y="524" width="500" height="120" rx="10" class="s"/>
  <text x="774" y="550" class="t1" font-size="14" font-weight="600">Schéma d'une entrée</text>
  <text x="774" y="576" class="t2 mono" font-size="11">id · key · kind · entite · page · section · cycle</text>
  <text x="774" y="596" class="t2 mono" font-size="11">engagement · n_min · source · runbook · owner · status</text>
  <text x="774" y="620" class="t3" font-size="11">exposé aussi en MCP : list_exceptions, get_signal, run_playbook</text>

  <rect x="240" y="664" width="1016" height="56" rx="10" class="s"/>
  <text x="258" y="690" class="t1" font-size="13" font-weight="600">Gouvernance</text>
  <text x="258" y="710" class="t2" font-size="12">modification d'un seuil = PR + review + entrée what-changed · dépréciation = status: deprecated, jamais de suppression d'ID (IDs canoniques)</text>
