# Tessera — signal catalog (routing of the 200 observability ideas)
# Companion to docs/observability-ideas.md (canonical IDs, do not renumber)
# and ADR 0010. One entry per idea. This file is the single source of truth
# for WHERE each idea lives in the restructured UI and WHAT it is.
#
# Vocabularies:
#   kind:       signal | workflow | capability | practice | artifact
#   entite:     reponse | modele | juge | retrieval | corpus | memoire | guard
#               | outils | graphe | session | utilisateur | produit | pipeline
#               | infra | cockpit
#   page:       qualite | securite | conformite | fiabilite | cout | agir
#               | plateforme | produit | repo
#               (fiabilite + cout render as one page "Fiabilité & coût";
#                "produit" = assistant-facing surface; "repo" = portfolio/repo
#                artifact, outside the cockpit UI)
#   section:    etat | diagnostic | predictif | prescriptif | na
#               (na = not a signal, no page section)
#   cycle:      ci | online | flywheel | design
#   engagement: slo | gate | legal | sla | none
#   status:     active  = exists in webapp today (page A widgets, replay views,
#                         session theater, page B evidence/exporters, infra)
#               planned = not yet implemented
#               Note: "58/200" counts page-A widgets only; this catalog also
#               marks page-B and infra capabilities as active, hence ~76.
#
# Entity pages (fiches) are reached by drill-down only; a signal appears on
# its `page` and on the fiche of its `entite`. Same data, two projections.

