# Auto-load every dashboard JSON under /var/lib/grafana/dashboards (ADR 0010).
apiVersion: 1

providers:
  - name: tessera
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
