# OpenTelemetry Collector — on_prem (sovereign) profile.  ADR 0010.
#
# The vendor-neutral hub: it receives gen_ai.* spans over OTLP, scrubs banking
# PII before anything leaves the box, and fans out to the self-hosted backends.
# Phase 1 ships the receive + redact + debug pipeline; Phase 2 adds the Phoenix
# and Langfuse exporters (marked below). Requires the *contrib* collector image
# (the redaction processor is not in the core distribution).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # PII-safe traces (ADR 0010, ideas #3/#4): redact banking identifiers from
  # span attribute *values* before any backend sees them. Defence in depth with
  # the in-process redaction added in a later phase.
  redaction:
    allow_all_keys: true
    blocked_values:
      - "[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}" # IBAN
      - "\\b\\d{13,19}\\b" # PAN / long account numbers
    summary: debug
  batch:
    timeout: 2s

exporters:
  debug:
    verbosity: normal
  # Canonical backend — Phoenix (OTLP/HTTP on its UI port, no auth). The image
  # serves OTLP HTTP at :6006/v1/traces; gRPC :4317 is not exposed.
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
  # Second fan-out — my own Langfuse. OTLP/HTTP with Basic auth built from the
  # LANGFUSE_INIT_* keys; the base64 is injected via the collector's env.
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTEL_BASIC_AUTH}"
  # Remote-profile metrics fan-out (ADR 0017 §7 / §F — the platform completion). Any agent
  # in another process or language emits OTLP metrics here; this exposes them on a scrape
  # endpoint Prometheus reads, so `tessera_agent_turns_total{agent_id=…}` — the L1
  # turn-evidence fact the cockpit resolves — reaches the spine with no cockpit import.
  # resource→label conversion so an agent_id carried as a resource attribute still lands
  # as a Prometheus label.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, batch]
      exporters: [debug, otlphttp/phoenix, otlphttp/langfuse]
    # Metrics ride the same OTLP wire. No redaction: metrics are low-cardinality Scope-dim
    # labels, PII-free by construction (metrics.py: never a per-case/conversation label).
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
