# Prometheus scrape config for the Claude-Powered observability stack (ADR 0010).
#
# Two real targets:
#   * the agent's own /metrics exporter (tessera_* business metrics), served by
#     the host uvicorn process on :9090 — reached from the container via the
#     Docker Desktop / host-gateway bridge `host.docker.internal`.
#   * the OTel Collector's internal telemetry (:8888) — pipeline throughput,
#     queue sizes, export failures (e.g. the Langfuse exporter retry loop).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Per-agent recording rules (ADR 0015 §Migration B) — pre-aggregated per-agent SLO / rate /
# quantile so the cockpit hot path reads O(1) aggregates, not heavy on-read PromQL.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: tessera-agent
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: tessera-agent

  - job_name: otel-collector
    static_configs:
      - targets: ["tessera-claude-collector:8888"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
