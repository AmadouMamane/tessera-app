[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "tessera"
version = "0.3.0"
description = "Multilingual (FR/DE/EN) banking support LLM agent for the European retail market, grounded in EU regulatory corpora and guarded by mcp-firewall."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Amadou Mamane Sarki", email = "mamanesarki@yahoo.fr" },
]
keywords = [
    "llm",
    "agent",
    "banking",
    "compliance",
    "gdpr",
    "dora",
    "langgraph",
    "multilingual",
    "rag",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # Agent orchestration
    "langgraph>=1.2.7,<2",
    "langchain-core>=1.4.8,<2",
    "langchain-google-vertexai>=3.2.4,<5",
    # HTTP layer
    "fastapi>=0.139.0,<1",
    # Pin starlette <1.0: 1.x moves its TestClient to an unvetted `httpx2`
    # dependency. 0.49.1+ still fixes CVE-2025-54121 and CVE-2025-62727; the
    # 1.x-only PYSEC-2026-161 is tracked as an ignored advisory (security.yml).
    "starlette>=1.3.1,<2.0",
    "uvicorn[standard]>=0.50.2,<0.51",
    "httpx>=0.28.1,<1",
    "python-multipart>=0.0.32,<0.1",
    # Rate limiting (ADR 0008) — the `limits` library does the windowing/storage;
    # we only add a thin deployment-aware middleware. No hand-rolled limiter.
    "limits>=5.8.0,<6",
    # Runtime guard (consumed as dependency — see docs/differentiation.md)
    "mcp-firewall>=0.1.0,<0.4",
    # Retrieval
    "psycopg[binary,pool]>=3.3.4,<4",
    "pgvector>=0.4.2,<0.5",
    "sqlalchemy>=2.0.51,<3",
    "alembic>=1.18.5,<2",
    # Local LLM path
    "ollama>=0.6.2,<0.7",
    # Configuration & validation
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "pyyaml>=6.0.3,<7",
    "jsonschema>=4.26.0,<5",
    # Observability
    "opentelemetry-api>=1.43.0,<2",
    "opentelemetry-sdk>=1.43.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.64b0,<1",
    "opentelemetry-exporter-gcp-trace>=1.12.0,<2",
    "structlog>=26.1.0,<27",
    "prometheus-client>=0.25.0,<0.26",
    # GCP integration
    "google-cloud-secret-manager>=2.29.0,<3",
    "google-cloud-logging>=3.16.0,<4",
    "google-cloud-aiplatform>=1.159.0,<2",
    "openai>=2.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0,<2",
]

[project.optional-dependencies]
on-prem = [
    # On-premises path: local Llama 3.3 70B via Ollama on Apple Silicon
    "sentence-transformers>=5.6.0,<6",
    "torch>=2.12.1,<3 ; platform_machine == 'arm64'",
]

# External memory backends (ADR 0007). The native window/summary/persistent
# tiers need none of these; each adapter lazily imports its engine and fails
# with a clear message when the matching extra is not installed.
memory-langmem = ["langmem>=0.0.30,<0.1"]
memory-mem0 = ["mem0ai>=2.0.11,<2.1"]
memory-zep = ["zep-python>=2.0.2,<3"]

[project.urls]
Homepage = "https://github.com/AmadouMamane/tessera"
Repository = "https://github.com/AmadouMamane/tessera"
Issues = "https://github.com/AmadouMamane/tessera/issues"
Documentation = "https://github.com/AmadouMamane/tessera/tree/main/docs"
Changelog = "https://github.com/AmadouMamane/tessera/blob/main/CHANGELOG.md"

[project.scripts]
tessera = "tessera.api.main:cli"
tessera-eval = "eval.runner:main"
tessera-ingest = "tessera.corpus.ingestion:main"

[dependency-groups]
dev = [
    # Lint, format, type-check
    "ruff>=0.15.20,<0.16",
    "mypy>=2.1.0,<3",
    "pre-commit>=4.6.0,<5",

    # Test
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-xdist>=3.8.0,<4",
    "hypothesis>=6.156.1,<7",

    # Type stubs
    "types-pyyaml>=6.0.12.20260518,<7",
    "types-jsonschema>=4.26.0.20260518,<5",

    # Local dev tooling
    "ipython>=9.15.0,<10",
    "rich>=15.0.0,<16",
]

eval = [
    # Non-regression harness (40 publicly documented agent failures)
    "promptfoo>=0.1.0,<0.2 ; python_version < '4'",
    "deepeval>=4.0.7,<5",
    "rapidfuzz>=3.14.5,<4",
]

docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocstrings[python]>=1.0.4,<1.1",
]

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tessera",
    "eval",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------

[tool.uv]
package = true
required-version = ">=0.5.0"

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "eval", "scripts"]
extend-exclude = [
    ".venv",
    "webapp/frontend",
    "infra/terraform/.terraform",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate (commented-out code)
    "G",      # flake8-logging-format
    "ANN",    # flake8-annotations
    "D",      # pydocstyle (Google style)
]
ignore = [
    "D203",     # one-blank-line-before-class (incompatible with D211)
    "D213",     # multi-line-summary-second-line (incompatible with D212)
    "PLR0913",  # too-many-arguments (LangGraph nodes legitimately take many)
    "S101",     # assert is fine in tests
    "ANN401",   # Any is acceptable in adapter boundaries
    "ANN101",   # self annotation not required in Python
    "ANN102",   # cls annotation not required in Python
    "D107",     # __init__ docstring — Google style uses the class docstring instead
    "PLW0603",  # global singletons are the intended pattern for module-level state
    "D105",     # magic methods (__str__, __repr__, etc.) don't need docstrings
    "RUF200",   # ruff 0.7.x predates PEP 639 SPDX `license` strings; pyproject is valid (uv/hatchling parse it)
]
unfixable = [
    "ERA001",   # never auto-delete commented code; require human review
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "ANN", "PLR2004", "ARG001", "ARG002"]
"eval/**/*.py" = ["D", "ANN", "T201"]
"scripts/**/*.py" = ["D", "T201", "S603", "S607"]
"src/tessera/__init__.py" = ["D104"]
"**/__init__.py" = ["D104", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["tessera", "eval"]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# Mypy — strict mode (frozen project convention)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
extra_checks = true
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
]
files = ["src/tessera", "tests"]
exclude = [
    "scripts/",
    "webapp/frontend/",
    "infra/",
    "build/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "ollama.*",
    "openai.*",
    "mcp_firewall.*",
    "langfuse.*",
    "promptfoo.*",
    "deepeval.*",
    "mem0.*",
    "langmem.*",
    "zep_python.*",
    "zep_cloud.*",
    "hvac.*",
    "google.cloud.aiplatform.*",
    "google.cloud.logging.*",
    "opentelemetry.exporter.cloud_trace.*",
    "opentelemetry.exporter.otlp.*",
    "vertexai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Thin OpenAI SDK adapter: the SDK ships strict overloaded stubs that fight a
# uniform message-dict payload. Relax the two SDK-call codes here only.
[[tool.mypy.overrides]]
module = ["tessera.llm.openai_backend"]
disable_error_code = ["call-overload", "arg-type", "misc"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.3"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Repo root on the path so the top-level `eval` package (not installed — only
# src/tessera is packaged) is importable by its grader unit tests.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--import-mode=importlib",
]
markers = [
    "integration: tests that hit Postgres, the LLM, or external services (deselect with '-m \"not integration\"')",
    "slow: tests that take more than one second",
    "fr: French-language agent path",
    "de: German-language agent path",
    "en: English-language agent path",
    "firewall: tests that exercise the mcp-firewall adapter",
    "regression: non-regression failure cases (see eval/failures/)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/tessera"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "src/tessera/observability/traces.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# Threshold reflects unit-test coverage in CI; integration tests (Postgres/LLM,
# not run in the fast CI job) exercise the rest.
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "build/coverage-html"

[tool.bandit]
# Justified, reviewed suppressions (run with `bandit -c pyproject.toml`):
# - B104: APISettings.host defaults to 0.0.0.0 — required for a containerised
#   service (Cloud Run / Docker) to accept traffic; also flagged inline.
# - B108: budget/audit default to /tmp paths — ephemeral local caches; the
#   container mounts a dedicated volume there. Also flagged inline.
# - B608: the only value interpolated into SQL in retrieval/store.py is the table
#   name, a trusted internal config constant; every user-supplied value is bound
#   as a %s query parameter, so there is no injection vector.
skips = ["B104", "B108", "B608"]
