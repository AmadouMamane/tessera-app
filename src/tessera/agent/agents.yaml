# Agent registry — the governed fleet (multi-agent Phase 1).
#
# Each agent is a governed *package*, not just an id: it BINDS reusable building
# blocks from the CONFIGURER catalogue (model, prompts, knowledge, guardrails,
# eval set, tool permissions) — it never redefines them (define/choose/govern).
# The `handoff` block is the governed agent graph: which agents this one may hand
# to / receive from. Slugs here are the URL segments (`/agents/<id>/...`) and the
# `agent_id` stamped on every event, metric and message.
#
# This file is the source of truth read by `tessera.agent.registry`. The seed
# (`scripts/seed_agents.py`) populates each agent's history; per-agent editable
# overrides live in the durable config store, layered on top of the bindings here.

default: support-client

agents:
  - id: support-client
    name: "Support Client"
    description: "SAV bancaire : solde, opérations, blocage de carte, questions réglementaires."
    owner: "Équipe Support"
    default_language: fr
    model: "llama3.2:3b"
    prompts: [system, planner, reviewer, reporter, escalation, decline]
    knowledge: [credit_aurore, regulations_gdpr, regulations_dora]
    guardrails: standard
    eval_set: support-client
    tools: [account_balance, card_block, transaction_search, ticket_escalate]
    # Audience / surface / auth (ADR 0008): who it serves, through which channel,
    # and the minimum session identity to reach it. Account tools already gate to
    # customer-auth internally, so the agent itself is anonymous-ok on the widget.
    audience: customer
    surface: [shared-customer-widget]
    auth: anonymous-ok
    tags: [support, client]
    handoff:
      to: [onboarding]
      from: [onboarding]
    # AgentSpec invocation block (ADR 0019 §1): the declared cockpit→agent seam. The customer
    # widget streams through the in-process `/chat` route — now DECLARED, not assumed. Pure
    # codification of current behaviour (no-op): the binding is data, never an import.
    invocation:
      binding: in_process_chat
    # AgentSpec observability block (ADR 0017 §3 · step 7 Lot 0). Telemetry-only Q&A agent:
    # it emits turn spans (graph_topology) + tool spans and runs a conversation workflow
    # mapped onto the grammar, but declares NO scored business workflow — no scorer,
    # capabilities or business_signals (those belong to workflow agents like recouvrement).
    # The level is COMPUTED, never tuned: L1 ungoverned, L2 once its eval-gating socle ran.
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [graph_topology, tools]
      workflows:
        - workflow_id: support_conversation_v1
          grammar: workflow_grammar.v1

  - id: onboarding
    name: "Onboarding"
    description: "Ouverture de compte : éligibilité, pièces justificatives, parcours KYC."
    owner: "Équipe Produit"
    default_language: fr
    model: "llama3.2:3b"
    prompts: [system, planner, reviewer, reporter, decline]
    knowledge: [credit_aurore, regulations_cnil, regulations_gdpr]
    guardrails: standard
    eval_set: onboarding
    tools: [loan_simulate, ticket_escalate]
    audience: customer
    surface: [shared-customer-widget]
    auth: anonymous-ok
    tags: [onboarding, kyc]
    handoff:
      to: [support-client]
      from: [support-client]
    # AgentSpec invocation block (ADR 0019 §1) — same in-process `/chat` seam as support-client,
    # now declared. No behaviour change.
    invocation:
      binding: in_process_chat
    # AgentSpec observability block (ADR 0017 §3 · step 7 Lot 0) — same telemetry-only shape
    # as support-client: turn + tool spans, a conversation workflow on the grammar, no scored
    # business workflow. Level computed, never tuned.
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [graph_topology, tools]
      workflows:
        - workflow_id: onboarding_conversation_v1
          grammar: workflow_grammar.v1

  - id: recouvrement
    name: "Recouvrement"
    description: "Relances et impayés : échéanciers, rappels, escalade conseiller."
    owner: "Équipe Conformité"
    default_language: fr
    model: "llama3.2:3b"
    prompts: [system, planner, reviewer, reporter, escalation, escalation_urgent_card]
    knowledge: [credit_aurore, regulations_bafin]
    guardrails: strict
    eval_set: recouvrement
    tools: [account_balance, transaction_search, ticket_escalate]
    # Internal back-office collections (ADR 0010): owned by Équipe Conformité,
    # strict guardrails. An OPERATOR agent — audience: operator, auth:
    # operator-rbac — OFF every customer-reachable pool by construction. It is
    # exposed on two operator surfaces: cockpit-embedded (Phase B — supervision
    # from the operator console) and dedicated-ui (Phase C — its own business
    # console reached directly by the `collections` role, never via the cockpit).
    # Reachability comes only from a verified signed operator assertion forwarded
    # by the Next BFF (tessera.api.operator); no customer session can satisfy it.
    # It stays exercised offline by the eval harness (package run directly,
    # independent of surface/auth). Cross-audience handoff edges to/from
    # support-client are removed: a customer chat can never hand into collections.
    audience: operator
    surface: [cockpit-embedded, dedicated-ui]
    auth: operator-rbac
    tags: [recouvrement, impayés]
    handoff:
      to: []
      from: []
    # AgentSpec invocation block (ADR 0019 §1): the operator's Console reaches recouvrement over
    # the in-process `/chat` seam, now declared. The declared consumer forwards a turn over this
    # transport under the operator assertion (0010 Phase B) — never an import of the runtime.
    # `canary_cadence_s` (ADR 0019 §I4) declares an hourly scheduled synthetic probe: recouvrement
    # is the meaningful canary target — it emits business events + scores, so its synthetic turns
    # are the ones the metric-exclusion invariant actually has to hold for. IDLE until the operator
    # flips `TESSERA_OBSERVABILITY__CANARY_SCHEDULER_ENABLED`; no behaviour change by default.
    invocation:
      binding: in_process_chat
      canary_cadence_s: 3600
    # AgentSpec observability block (ADR 0017 §3 + A1 + A2.3) — recouvrement declares the
    # first manifest (Phase B). Everything the cockpit renders for this agent's business
    # surfaces is generated from here; nothing hand-placed per agent. Policy IMPLEMENTATIONS
    # stay deterministic code in `tessera.recouvrement.*` — the manifest declares only ids,
    # reason codes and metadata (A1.1 / A2.3). Business signal keys must be produced by the
    # bound scorer (pinned by `tests/unit/test_agentspec_conformance.py`).
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [graph_topology, tools]
      capabilities:
        - id: summarize_case
          label_key: capability.summarize_case
          output_artifacts: [case_summary_v1]
          external_effect_level: none
        - id: check_contact_rule
          label_key: capability.check_contact_rule
          output_artifacts: [contact_rule_v1]
          policies: [contact_window_policy]
          external_effect_level: none
        - id: explain_payment_options
          label_key: capability.explain_payment_options
          output_artifacts: [payment_options_v1]
          policies: [payment_options_safety]
          external_effect_level: draft
        - id: draft_reminder
          # `reminder_draft_v1` is what `_reminder_artifact` emits when the draft does not
          # come from a schedule (recouvrement.py); it was missing here, so the manifest
          # under-declared the agent's own output. The frontend knew the type and the
          # declaration did not — the exact gap that makes an enum hand-written.
          output_artifacts: [client_message_artifact, reminder_draft_v1]
          label_key: capability.draft_reminder
          policies: [contact_window_policy, client_message_safety]
          external_effect_level: requires_validation
        - id: propose_schedule
          label_key: capability.propose_schedule
          output_artifacts: [schedule_proposal_v2]
          policies: [contact_window_policy, amount_consistency_policy]
          external_effect_level: requires_validation
      policies:
        - id: contact_window_policy
          label_key: policy.contact_window
          version: 1.0.0
          severity: blocking
          applies_to: [check_contact_rule, draft_reminder, propose_schedule]
          reason_codes: [OUTSIDE_CONTACT_WINDOW, UNAUTHORIZED_SURFACE]
        - id: client_message_safety
          label_key: policy.client_message_safety
          version: 1.0.0
          severity: blocking
          applies_to: [draft_reminder]
          reason_codes: [UNSAFE_CLIENT_MESSAGE]
        - id: payment_options_safety
          label_key: policy.payment_options_safety
          version: 1.0.0
          severity: blocking
          applies_to: [explain_payment_options]
          reason_codes: []
        - id: amount_consistency_policy
          label_key: policy.amount_consistency
          version: 1.0.0
          severity: blocking
          applies_to: [propose_schedule]
          reason_codes: [AMOUNT_MISMATCH]
      workflows:
        - workflow_id: recouvrement_collections_v1
          grammar: workflow_grammar.v1
          scorer: recouvrement.collections.v1
      business_signals:
        - key: contact_window_compliance
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
          engagement: legal
          north_star: true
        - key: validation_required_compliance
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
          engagement: legal
        - key: action_blocking_correctness
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: artifact_governance
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: client_message_safety
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: payment_option_safety
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: action_governance
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: no_uncontrolled_external_effect
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: recouvrement_trace_completeness
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]
        - key: amount_consistency
          source: business_score
          level: runtime
          unit: ratio
          aggregation: mean
          dimensions: [agent, time]

  # ── ADR 0017 §F — the second-runtime acceptance agent ────────────────────────
  # An out-of-process OTLP agent (examples/hello-agent/) with ZERO tessera import. Its
  # AgentSpec is the only onboarding artifact besides the process + generic config; the
  # cockpit awards L1 from real facts — the declared observable contract (below) AND the
  # Prometheus turn counter it emits (ADR 0017 §F turn-evidence). No scorer / capabilities /
  # business_signals: it runs no scored business workflow. No eval set → ungoverned → the L1
  # rung. The level is COMPUTED, never tuned.
  - id: hello-agent
    name: "Hello Agent"
    # `description` is read by a business audience on the fleet card, not by a reviewer. It states
    # the INTENT — a real fleet is heterogeneous (other teams, other vendors, acquisitions), so a
    # platform that only governs the agents it built governs nothing. Never state what the agent
    # does not import: the implementation truth (out-of-process, pure OTLP, zero tessera import,
    # ADR 0017 §F) lives in the module docstring and in the blocks below.
    description: "Agent construit par une autre équipe, sur une autre technologie. Tessera sait le surveiller quand même."
    owner: "Platform"
    default_language: en
    audience: operator
    # Supervised from the operator console (cockpit-embedded). NOT on dedicated-ui: it is a
    # telemetry-only demo, not a routable collections chat core — keeping it off dedicated-ui
    # preserves recouvrement as the sole business-console agent.
    surface: [cockpit-embedded]
    auth: operator-rbac
    tags: [demo, second-runtime]
    handoff:
      to: []
      from: []
    # AgentSpec invocation block (ADR 0019 §1): the honest default. hello-agent is publish-only
    # (out-of-process, pure OTLP, zero tessera import) — it exposes NO test invocation, so its
    # Console renders honest-empty ("observe it through its runs and evals"), never a broken chat.
    invocation:
      binding: none
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [turns]
      workflows:
        - workflow_id: hello_v1
          grammar: workflow_grammar.v1

  # ── ADR 0019 §I3 — the first invocable external agent ─────────────────────────
  # The counterpart to hello-agent: hello-agent proves the PUBLISH-ONLY contract
  # (binding: none, pure OTLP, honest-empty console); turn-agent proves the INVOCABLE
  # contract — it EXPOSES an HTTP /turn endpoint speaking the ADR 0018 turn contract, so
  # the cockpit's HttpTurnInvoker can send it a turn under the declared `binding: http`.
  # Out-of-process, zero tessera import (examples/turn-agent/). Reached only over the
  # declared transport under a forwarded operator assertion — never a module import (the
  # 0017 §1 boundary ratchet stands). Operator surface, cockpit-embedded, like hello-agent.
  - id: turn-agent
    name: "Turn Agent"
    # Same register and same intent as hello-agent (see there); the sentences are parallel on
    # purpose, so the contrast falls on *surveiller* vs *tester* — the two planes, unnamed.
    description: "Agent construit par une autre équipe, sur une autre technologie. Un opérateur peut quand même le tester depuis le cockpit."
    owner: "Platform"
    default_language: en
    audience: operator
    surface: [cockpit-embedded]
    auth: operator-rbac
    tags: [demo, second-runtime, invocable]
    handoff:
      to: []
      from: []
    # AgentSpec invocation block (ADR 0019 §1 + §I3): the http binding. The agent EXPOSES the
    # endpoint; the cockpit CONSUMES this declaration and forwards the signed operator assertion
    # (0010 Phase B) to it — no anonymous invocation, ever. Endpoint is the dev target the example
    # serves on; in a real deployment it is the agent's own reachable turn URL.
    invocation:
      binding: http
      endpoint: http://127.0.0.1:8500/turn
      timeout_ms: 8000
      auth: operator-assertion
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [turns]
      workflows:
        - workflow_id: turn_v1
          grammar: workflow_grammar.v1

  - id: duplex-agent
    name: "Duplex Agent"
    # Third in the same register as hello-agent and turn-agent (see there). The two sentences are
    # deliberately the union of theirs: this agent can be tested AND it reports on its own. The
    # contrast falls on *et* — the two planes composing, both unnamed.
    description: "Agent construit par une autre équipe, sur une autre technologie. Un opérateur peut le tester depuis le cockpit, et son activité y remonte d'elle-même."
    owner: "Platform"
    default_language: fr
    audience: operator
    surface: [cockpit-embedded]
    auth: operator-rbac
    tags: [demo, second-runtime, invocable, observable]
    handoff:
      to: []
      from: []
    # ADR 0019 §Amendment 1 A1.2 — the integration witness. Same http binding as turn-agent (the
    # cockpit forwards the signed operator assertion to the declared turn URL), but this one also
    # publishes its own telemetry, so invoking it PRODUCES the turn evidence that raises its own
    # computed level. Its port is one above turn-agent's so both examples can run side by side.
    invocation:
      binding: http
      endpoint: http://127.0.0.1:8501/turn
      timeout_ms: 8000
      auth: operator-assertion
    observability:
      spec_version: agentspec.v1
      telemetry_capabilities: [turns]
      # The first capability anywhere to declare an `input_schema`: the Console renders it as a
      # generated form (§A1.2 c). `label_key` resolves in the existing locale catalogues — an
      # agent's arrival adds no frontend line, which is the criterion.
      capabilities:
        - id: propose_schedule
          label_key: capability.propose_schedule
          input_schema: schemas/propose_schedule.json
          external_effect_level: none
      workflows:
        - workflow_id: duplex_turn_v1
          grammar: workflow_grammar.v1
