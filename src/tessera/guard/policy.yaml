# Tessera runtime guardrail policy.
#
# This file is the canonical, auditable description of what tools the agent
# may invoke, under what conditions, and what redactions to apply. It is
# read at start-up by tessera.guard.adapter and re-read on SIGHUP.
#
# Schema:
#   version: integer, bumped on every breaking change.
#   tools:
#     <tool_name>:
#       allow: bool                       # default: false
#       requires_confirmation: bool       # require explicit human confirmation
#       confirmation_binds: <arg_name>    # the approval is valid for THAT value only
#       require_auth: customer-auth       # minimum session authorization (ADR 0008/0009);
#                                         # absent = no auth floor
#       require_languages: [fr, de, en]   # restrict invocation to listed langs
#       max_calls_per_turn: int           # default: 1
#       arguments:                        # per-argument validation
#         <arg_name>:
#           pattern: regex                # value must match
#           required: bool                # absent/null argument is a DENY (default: false)
#           redact_in_audit: bool         # mask value in the audit trail
#   prompt_injection:
#     transform_patterns:
#       - match: regex
#         replacement: string
#     # NOTE: `deny_patterns` is NOT a field here. Injection detection is sourced from the
#     # separate `limes` package (ADR 0029) and a non-empty list makes load_policy REFUSE to
#     # load, so that two sources of truth cannot silently coexist.
#   pii:
#     redact_patterns: [regex, ...]       # applied to tool arguments in the audit copy
#                                         # and to the final response (output guard)
#     exfiltration_patterns:              # conjunctive: ALL must match to deny
#       <name>: regex
#     third_party_data_patterns:          # conjunctive: ALL must match to deny
#       <name>: regex
#     third_party_singling_patterns:      # conjunctive: ALL must match to deny
#       <name>: regex

version: 1

tools:
  account_balance:
    allow: true
    requires_confirmation: false
    # Reaches a customer's account data → requires an authenticated customer
    # session (ADR 0008/0009). An anonymous session is denied at the guard.
    require_auth: customer-auth
    max_calls_per_turn: 2
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        redact_in_audit: true

  card_block:
    allow: true
    requires_confirmation: true
    # The approval names the card it was given for. A human who agreed to block 4242 has
    # not agreed to block whichever four digits the model produces on the next turn.
    confirmation_binds: card_last_four
    require_auth: customer-auth
    max_calls_per_turn: 1
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        required: true
        redact_in_audit: true
      card_last_four:
        pattern: "^[0-9]{4}$"
        required: true
        redact_in_audit: false
      reason:
        pattern: "^(lost|stolen|fraud_suspected|customer_request)$"
        redact_in_audit: false

  transaction_search:
    allow: true
    requires_confirmation: false
    require_auth: customer-auth
    max_calls_per_turn: 3
    arguments:
      customer_id:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        redact_in_audit: true

  loan_simulate:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 5
    arguments:
      amount:
        # Max 10M EUR — rejects aberrant values like 1 000 000 000
        pattern: "^[0-9]{1,7}(\\.[0-9]{1,2})?$"
        redact_in_audit: false
      years:
        pattern: "^([1-9]|[12][0-9]|30)$"
        redact_in_audit: false

  ticket_escalate:
    allow: true
    requires_confirmation: false
    max_calls_per_turn: 1
    arguments:
      transcript_excerpt:
        redact_in_audit: true

# Prompt-injection DETECTION moved to the `limes` package (ADR 0028/0029).
# `deny_patterns` used to hold Tessera's injection regexes; they were extracted
# into limes (its `origin: tessera` rules ARE these patterns, verbatim), and
# limes added the `origin: limes` rules that close case 08 (a `SYSTEM:` directive
# hidden in a quoted payee name). This list MUST stay empty: limes is the single
# source of truth. load_policy() DERIVES policy.prompt_injection_deny from limes
# at load time (so display / trajectory / retraction surfaces read one source),
# and REFUSES to load if a pattern is re-added here (that would be the divergence
# bug ADR 0029 forbids). Add patterns to limes' detectors/policy.yaml instead.
#
# `transform_patterns` remains a first-party, DECLARED sanitisation layer
# (allow-with-redaction of role-play cues limes allowed) — distinct from
# detection, and empty today.
prompt_injection:
  deny_patterns: []
  transform_patterns: []

# Patterns that constitute personal data and must be masked from logs, from
# arguments echoed back to the LLM, and from the agent's final response (the
# output guard — tessera.guard.redaction, harness cases 02/45).
pii:
  redact_patterns:
    # Email
    - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    # IBAN (FR/DE/AT/BE/NL/IT/ES, basic shape — full check at the tool layer)
    - "(?i)[A-Z]{2}[0-9]{2}[A-Z0-9 ]{11,30}"
    # 16-digit PAN
    - "\\b(?:\\d[ -]?){13,19}\\b"
    # French phone number
    - "\\b(?:\\+33|0)[1-9](?:[ .-]?[0-9]{2}){4}\\b"
    # German phone number
    - "\\b(?:\\+49|0)[1-9][0-9]{1,4}[ /-]?[0-9]{3,10}\\b"

  # Egress guard (harness case 46): a request to *send account data to an
  # e-mail address* is refused at input — the agent has no outbound e-mail
  # channel, so third-party egress is never legitimate. Conjunctive rule:
  # every pattern below must match the user input. A bare address ("my new
  # e-mail is x@y.com") or a bare verb ("send me my statement") never trips it.
  exfiltration_patterns:
    egress_verb: "(?i)\\b(envoie[sz]?|envoyer|envoyez|transmet(s|tez|tre)?|transf[eè]re[sz]?|transf[ée]rez|forward|send|e-?mails?|mail[es]?|sende[nt]?|sendest|schick(e|st|t|en)?|weiterleiten|leite|[üu]bermitt(le|elst|elt|eln))\\b"
    external_address: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    account_data: "(?i)\\b(comptes?|soldes?|iban|rib|relev[ée]s?|op[ée]rations?|transactions?|virements?|historique|r[ée]capitulatifs?|konto\\w*|ums[äa]tze|zusammenfassung|accounts?|balances?|statements?|summary|history)\\b"

  # Third-party PII guard (harness cases 13/14/15/47, tool-auth 31): a request
  # to DISCLOSE another person's account data is refused at input — the agent
  # only ever serves the authenticated session's own account, and third-party
  # data requires a mandate handled in-branch, never in chat. Conjunctive rule,
  # deliberately narrow (a false positive breaks a legitimate turn): it takes a
  # relation noun naming the third party AND a third-person possessive tying
  # the account data to that person AND an explicit disclosure ask. "My
  # husband and I have a joint account, what is our balance?" (first-person
  # data), "my mother passed away, how do I close her account?" (procedural,
  # no disclosure ask) and "I transferred money to my sister's account, has it
  # arrived?" (no disclosure ask) never trip it.
  third_party_data_patterns:
    # Relation/civility noun naming a person other than the session holder.
    third_party_subject: "(?i)\\b(voisins?|voisines?|coll[eè]gues?|fr[eè]res?|s[œo]eurs?|s[œo]urs?|maris?|femmes?|[ée]poux|[ée]pouses?|amis?|amies?|colocataires?|cousins?|cousines?|oncles?|tantes?|p[eè]res?|m[eè]res?|fils|filles?|patrons?|autre client|M\\.|Mme|Mlle|Monsieur|Madame|Nachbar(in|n|s)?|Kolleg(e|en|in|innen)|Bruders?|Schwester|Mann(es)?|Ehemann(es)?|Frau|Ehefrau|Freund(in|es)?|Mitbewohner(in|s)?|Vaters?|Mutter|Sohn(es)?|Tochter|Chef(in|s)?|anderer? Kunde|anderen Kunden|Herrn?|neighbou?rs?|colleagues?|brothers?|sisters?|husbands?|wife|wives|friends?|flatmates?|roommates?|fathers?|mothers?|sons?|daughters?|another customer|other customer|Mr|Mrs|Ms|Miss)\\b"
    # Account data possessed by a third person (son/sein/his — never mon/mein/my).
    # The German sein/ihr leg is case-sensitive on purpose: formal "Ihr Konto"
    # (= YOUR account, capital I mid-sentence) must never count as third-party.
    third_party_possession: "(?i:\\b(son|sa|leur)\\s+(salaire|solde|compte|iban|rib|historique|op[ée]rations?|transactions?|relev[ée]s?|revenus?|d[ée]couverts?|encours)\\b|\\bcompte\\s+d[eu]\\s+(mon|ma|son|sa)\\b|\\b(his|her|their)\\s+(accounts?|balances?|salar(y|ies)|iban|transactions?|statements?|histor(y|ies)|overdrafts?)\\b|\\bKonto\\w*\\s+(meiner|meines|seiner|seines|ihrer|ihres|deiner|deines)\\b)|\\b(sein(e[mnrs]?|es|er)?|ihr(e[mnrs]?|es|er)?)\\s+(Konto\\w*|Gehalt\\w*|Umsatz|Ums[äa]tzen?|IBAN|Saldo|Transaktion\\w*|Kontoausz(ug|[üu]ge)|Verm[öo]gen|Einkommen)\\b|\\b([A-Z][a-z]\\w*|(?i:neighbou?rs?|colleagues?|brothers?|sisters?|husbands?|wife|wives|friends?|flatmates?|roommates?|fathers?|mothers?|sons?|daughters?))['’]s\\s+(?i:accounts?|balances?|salary|iban|transactions?|statements?|history)\\b"
    # Explicit ask to hand the data over (never a procedural "how do I…").
    disclosure_request: "(?i)\\b(quel(le)?s?\\s+(est|sont|[ée]tai(en)?t)|combien|donne[sz]?[- ]?(moi|nous)?|sors[- ]?(moi)?|montre[sz]?|affiche[sz]?|communique[sz]?|redonne[sz]?|indique[sz]?|fournis|je veux|dis[- ]moi|dites[- ]moi|wie hoch|wie viel|was ist|nenn(e|en)?\\b|gib\\b|geben sie|zeig(e|en)?\\b|sag(e|en)?\\s+(mir|sie mir)|verrat(e|en)?|m[öo]chte ich|ich will|what(['’]s|\\s+is|\\s+are|\\s+was)|how much|give me|pull\\b|show\\b|read back|tell me|i want|list\\b|share\\b)"

  # Singling-out / re-identification guard (harness case 16): an ask to name
  # the one customer matching correlated quasi-identifiers (branch × birth
  # year × transaction) is a linkage attack, refused at input. Conjunctive:
  # a singling quantifier AND an identifying attribute AND an identity ask.
  # "Am I the only customer with this problem?" never trips it (no identity
  # ask); "who is your branch manager?" never trips it (no quantifier).
  third_party_singling_patterns:
    singling_quantifier: "(?i)\\b(seule?)\\s+(client|d[ée]posant|titulaire)|einzig\\w*\\s+(Kunde|Kundin)|\\b(only|single|one)\\s+customer"
    identifying_attribute: "(?i)n[ée]e?\\s+en\\s+(19|20)\\d{2}|geboren\\s+(im\\s+Jahre?\\s+)?(19|20)\\d{2}|born\\s+in\\s+(19|20)\\d{2}"
    identity_request: "(?i)\\b(son|leur)\\s+nom|\\bnom\\s+du\\s+client|seinen?\\s+Namen|ihren?\\s+Namen|wie\\s+hei[ßs]t|(his|her|their)\\s+name|who\\s+is|qui\\s+est|wer\\s+ist"
